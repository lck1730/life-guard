<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget：让键盘弹出时**收缩内容**而不是把页面顶上去。
     不写这个的话，安卓 WebView 会把输入框推到看不见的地方。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<script>
  // ★ 2026-10-19：先把上次用的主题贴上 ✓ —— 奶霜/林深用户不必先闪一下深色底 ✓。
  //   登录后 `syncThemeForUser()` 会按账号换成这个人自己的那套 ✓。
  try {
    var _t = localStorage.getItem('lg_theme');
    if (_t === 'light') _t = 'cream';   // 旧版本存过的名字
    if (_t === 'cream' || _t === 'forest') document.documentElement.dataset.theme = _t;
  } catch (e) {}
</script>
<title>生活管家</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- ★ 2026-10-20：**开局加载页** ✓ —— 从第一帧就盖住整屏 ✓，
     直到「消息画完 + 背景图解码完 + 至少 0.5 秒」才撤 ✓（见 01-core.js 的 `_bootReady` ✓）。
     ⚠️ **它不带 `hidden`** ✗ —— 以前那个转圈是藏着的、200ms 后才亮 ✓，
        所以慢的时候会先露一截空白 / 深色底 ✓；加载页反过来：**先亮着** ✓。
     ⚠️ 颜色全部走主题变量 ✓（`--bg` / `--text` / `--accent` / `--line` ✓）——
        夜阑 / 奶霜 / 林深三套自动跟着换 ✓，不用另写一份 ✓。 -->
<div id="boot" role="status" aria-label="正在加载生活管家">
  <div class="boot-aurora" aria-hidden="true"></div>
  <div class="boot-grid" aria-hidden="true"></div>
  <div class="boot-main">
    <div class="boot-mark" aria-hidden="true">
      <!-- 屋檐 + 门 + 一颗小星光 ✓ —— 和 App 里其它图标同一套画法（细描边、圆端点 ✓） -->
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 23.5 24 11.5l13.5 12"/>
        <path d="M14 23v12.5h20V23"/>
        <path d="M20 35.5v-7.5h8v7.5"/>
        <path d="M35.6 9.2l1.05 2.75 2.75 1.05-2.75 1.05-1.05 2.75-1.05-2.75-2.75-1.05 2.75-1.05z"
              fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="boot-title">生活管家</div>
    <div class="boot-slogan">一个越用越懂你的管家</div>
  </div>
  <div class="boot-foot">
    <div class="boot-bar" aria-hidden="true"><i></i></div>
    <div class="boot-tip">正在准备你的空间…</div>
  </div>
</div>

<!-- 登录 -->
<div class="screen" id="login">
  <!-- ★ 2026-10-09：**照壳原来那一版重做** ✗→✓（用户：「登录界面和注册界面
       之前保持一致，现在不对」✓）。版式全部照抄（`tools/lifeguard-shell.py`
       的 `renderLogin` ✓）：
         · hero 在**卡片外面**（大标题 + 一句广告词 ✓）
         · 每个输入框**上面有 label** ✓（不是光靠 placeholder ✓）
         · 注册时**内测码排第一** ✓（它是进门凭证 ✓）
         · 错误**在按钮下面** ✓，切换那行在最后 ✓
         · 文案也照抄：「还没有账号？创建一个」/「已有账号，去登录」✓ -->
  <div class="wrap">
    <div class="hero">
      <div class="t">生活管家</div>
      <div class="s">一个越用越懂你的管家</div>
    </div>
    <div class="card">
      <label class="regonly" id="lBeta" hidden>内测码</label>
      <input class="field regonly" id="betaCode" placeholder="请填写内测码"
             autocapitalize="off" autocomplete="off" hidden>
      <label for="u">用户名</label>
      <input class="field" id="u" placeholder="用户名" autocapitalize="off" autocomplete="username">
      <label for="p">密码</label>
      <input class="field" id="p" type="password" placeholder="密码" autocomplete="current-password">
      <label class="regonly" id="lP2" hidden>重复密码</label>
      <input class="field regonly" id="p2" type="password" placeholder="再输一遍"
             autocomplete="new-password" hidden>
      <button class="btn-primary" id="doLogin">登录</button>
      <div class="err" id="loginErr"></div>
      <div class="swap"><b id="authSwap">还没有账号？创建一个</b></div>
    </div>
  </div>
</div>

<div class="screen" id="init">
  <!-- ★ 2026-10-09 用户定的两件事 ✗→✓：
       · 「第一次登录时的新建或加入生活空间也改名空间」✓
       · 「对空间的介绍去掉，界面简洁」✓ →
         原来那张"生活空间是什么"的浮卡**整个删了** ✓（点按钮直接进表单 ✓）。 -->
  <!-- ★ 2026-10-09 收拾过 ✗→✓（用户：「比较朴素…要那种简约大气又不会太简陋」✓）——
       做法不是"再糊一层装饰" ✗，而是**把它对齐到登录那一屏的版式** ✓：
       同一个 `.wrap` 卡片 ✓、同一套 `.hero .t/.s` 大小标题 ✓（他自己的规矩：
       同构界面必须长一样 ✓）。原来这里是三行裸文字 + 一颗按钮 ✓，
       什么都没有垫着 ✓ —— 那正是"简陋"的来源 ✓。 -->
  <div class="wrap">
    <div class="hero">
      <div class="t">欢迎使用生活管家</div>
      <div class="s">继续使用请先</div>
      <!-- ⚠️⚠️ **按钮必须在 `.hero` 里面** ✗→✓（2026-10-10 量出来的）——
           我这天早些时候把它挪到了 hero **外面** ✗：那样一来
           `align-items:center`（弹性盒子的居中 ✓）根本管不到它 ✓，
           而它是个 `inline-block` ✓ —— `margin:0 auto` 对**行内级**盒子无效 ✗✗
           → 它就**贴左**了 ✓（量出来的中点 196 ✓，卡片中点 250 ✓，差 54px ✓）。
           放回 hero 里面 = 它成了一个 flex item ✓ → 居中由 `align-items` 负责 ✓，
           和标题/副标题**同一个机制** ✓（以后不用再各管各的 ✓）。
         ⚠️ 原来的通栏按钮**看不出这个错** ✗（满宽一定是"居中"的 ✓）——
           这次改成"贴字的紧凑按钮" ✓ 才把它露出来 ✓。 -->
      <button class="btn-primary" id="initGo">＋&nbsp;&nbsp;新建或加入一个空间</button>
    </div>
    <!-- ⚠️ 这里有过一行「退出登录」（2026-10-09 加的 ✓，理由是"没有空间的人
         换不了号" ✓）—— 用户当天就让撤了 ✓（「得得，把退出登录去掉」✓）。
         ⚠️ **那个理由本身是真的** ✗（壳那版也防过这件事 ✓）：还没有空间的人
            确实进不到设置页 → 也就没有登出入口 ✓。撤了之后**这个缺口又回来了** ✓，
            先记在这儿 ✓，他哪天说"换不了号"就是这一条 ✓。 -->
  </div>
  <!-- ★ 2026-10-10 用户定的形状 ✓：**两个框 + 底部一颗按钮** ——
       每个框自己头上一行提示 ✓（「新建个空间？」/「加入已有空间？」✓），
       框里是占位提示 ✓（「为空间起个名字」/「输入邀请码」✓）；
       ⚠️ 两颗按钮并排那种**没有了** ✓（原来是一颗"新建"一颗"加入" ✓）——
         他说的是"底部一个按钮" ✓（名字「加入空间」✓，填哪个框就走哪条路 ✓）。 -->
  <div class="introcard" id="introCard" hidden>
    <label class="fld" for="spaceName">新建个空间？</label>
    <input class="field" id="spaceName" placeholder="为空间起个名字" maxlength="32" autocomplete="off">
    <label class="fld" for="joinCode">加入已有空间？</label>
    <input class="field" id="joinCode" placeholder="输入邀请码" maxlength="16"
           autocapitalize="characters" autocomplete="off">
    <!-- ⚠️ 一开始是**灰的** ✓（两个框都空 ✓），填了任意一个才亮 ✓ -->
    <button class="btn-primary" id="spaceGo" disabled>加入空间</button>
  </div>
</div>

<!-- 我的（数据由 JS 画 ✓ 和 `#agent` 一个做法 ✓） -->
<!-- ★ 2026-10-24：「我的」也**加了一条顶栏** ✓（和「聊天背景」「主题」同一套 `header.sub` ✓）——
     原来这一屏只有一张资料卡悬在状态栏下面 ✓，进来第一眼不知道自己在哪 ✓。
     ⚠️ **只有标题、没有返回箭头** ✓ —— 用户定的：「也是不要<，然后手势可返回」✓；
        两边各留一个 40px 占位 ✓ 让标题真居中 ✓（见 CSS `header.sub` 那几条 ✓）。
     ⚠️ 有顶栏之后 `.abody` 的顶距会自己变成 14px ✓（`.ascreen > header.sub ~ .abody` ✓）——
        **不用**另写 ✓。 -->
<div class="screen ascreen" id="me"><header class="sub"><h2>我的</h2><div class="spacer"></div></header><div class="abody" id="meBody"></div></div>
<!-- 改资料（头像 + 昵称 ✓）—— 和管家同一批 class ✓ -->
<div class="screen ascreen" id="meEdit"><div class="abody" id="meEditBody"></div></div>
<!-- 生活空间：改名 / 邀请码 / 退出该空间（用户 2026-10-08 定的三样 ✓） -->
<!-- 自我介绍（≤500 字 ✓，可空 ✓）—— 跟着每一轮进它脑子 ✓ -->
<!-- 别人的那一屏：头像+昵称（和我的、管家同构 ✓）+ 备注 ✓ -->
<div class="screen ascreen" id="peer"><div class="abody" id="peerBody"></div></div>

<!-- 聊天 -->
<div class="screen" id="chat">
  <header class="top">
    <!-- ⚠️ **原来带一个 `margin-left:-8px`** ✗ —— 2026-10-06 用户指出的：
         "群昵称和管家状态…似乎不算完全居中" ✓。
         它把整个顶栏往左顶了 8px ✓，右边那个占位却还是 40px ✓，
         于是中间那块**向左偏了 4px** ✓ —— 肉眼看得出来 ✓。
         删掉 ✓：现在左 ☰ 40px、右占位 40px、两边内边距都是 16px ✓，
         **居中由结构保证** ✓，不是靠"记得两边对称地写" ✓。
         （颜色也补上 `plain` ✓ —— 和「<」那个返回箭头同一个 `--text` ✓，
           原来用的是 `.icon-btn` 默认的 `--muted` ✓，淡一档 ✓。） -->
    <!-- ☰ 用 **SVG** 而不是文字字符 ✗→✓ —— 2026-10-06：
         文字字形的"墨迹"离盒子边多远是**字体决定的** ✓，
         我没法算准 ✓，也就没法跟别的图标对齐 ✓。
         SVG 的位置是**算得出来**的 ✓（下面那条 `translateX` 就是这么来的 ✓）。 -->
    <div class="icon-btn plain" id="openSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6h12M6 12h12M6 18h12" />
      </svg>
    </div>
    <div class="info">
      <div class="gname" id="gname">—</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
    </div>
    <!-- ★ 右上角：**刷新** ✓ —— 2026-10-20 用户定的 ✓：
         「将设置左上角的刷新按钮挪到主群聊右上角」✓。
         ⚠️ 原来这里是四格图标，**整个拿掉了** ✓；
            刷新用的是设置页那颗**原封不动的按钮** ✓（`#reloadBtn` 这个 id 没改 ✓，
            下面那段绑定、以及 CSS 里"墨迹离右 23.9px"那个数都原样能用 ✓）。
         ⚠️ 图标是 SVG（和 ☰ 同一套画法 ✓）而不是文字或 emoji ✗ ——
            字形的墨迹位置算不准 ✓，就没法跟左边对齐 ✓。
         ⚠️ 外面那个 **40px 方框不动** ✓ —— 左中右各 40px 是"群名居中"的保证 ✓。 -->
    <button class="icon-btn plain" id="reloadBtn" aria-label="重新加载">
      <!-- 用的是 Feather 那个 rotate-cw ✓（`viewBox 0 0 24 24` ✓）。
           ⚠️ 别自己拼 ✗ —— 我上一版是算出来的弧 ✓，
             末端和箭头**差一点点接上** ✗ → 看着就像画歪了 ✓
             （用户原话："首尾几乎挨上了" ✓）。
             这个版本的弧线末端**正好落在**箭头那个拐角上 ✓，是接住的 ✓。
           `19` 而不是 22 ✓ —— 用户："刷新按钮稍微小一些" ✓
           （22 的描边箭头视觉上比 22 的返回箭头重一档 ✓）。 -->
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
    </button>
  </header>
  <div id="msgs"></div>
  <div id="composer">
    <div id="atMenu"></div>
    <!-- 引用条：长按气泡选了「引用」之后出现在这里，发完自动消失。
         微信也是这个样子——引用是**输入状态**的一部分，不是消息的一部分。 -->
    <!-- 待发附件：`+` 里选的图和文件先停在这儿 ✓，发出去之前一直留着 ✓ -->
    <div id="pendbar" hidden></div>

    <div id="qbar" hidden>
      <div class="qbody">
        <div class="qwho" id="qwho"></div>
        <div class="qtext" id="qtext"></div>
      </div>
      <button class="qx" id="qclose" aria-label="取消引用">✕</button>
    </div>
    <div id="composerRow">
      <!-- 语音/键盘切换：**图标要跟着模式变**（微信就是这样的）
           键盘模式显示"麦克风"（点了切语音），语音模式显示"键盘"（点了切回来）。
           两个 SVG 都在，靠 body.voiceMode 决定显示哪个。 -->
      <button class="icon-btn" id="modeToggle" aria-label="切换语音/键盘">
        <svg class="ico-mic" viewBox="0 0 24 24" width="26" height="26" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
          <path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3"/>
        </svg>
        <svg class="ico-kbd" viewBox="0 0 24 24" width="26" height="26" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6" width="19" height="12" rx="2.5"/>
          <path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 14h12"/>
        </svg>
      </button>

      <!-- 不放 placeholder：微信的输入框就是空的，提示文字反而占地方 -->
      <textarea id="text" rows="1"></textarea>
      <button id="holdTalk">按住 说话</button>

      <!-- 表情包入口：位置先留着，内容后面内置。
           微信的排版是 [语音] [输入] [表情] [+] ——按这个顺序排。 -->
      <button class="icon-btn" id="pickSticker" aria-label="表情">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
          <circle cx="9" cy="9.5" r=".6" fill="currentColor"/>
          <circle cx="15" cy="9.5" r=".6" fill="currentColor"/>
        </svg>
      </button>

      <button class="icon-btn" id="pickMedia" aria-label="更多">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
        </svg>
      </button>
      <button id="send" aria-label="发送">
        <!-- 纸飞机：**线条型、机头朝右** ✓ —— 2026-10-06 用户："也是线条型的 svg，
             然后左右方向" ✓（由"朝上"改成"横向朝右" ✓ —— 那才是"发送"的常规方向 ✓）。
             形状就是刚才那个三角帆**顺时针转了 90°** ✓
             （同一个造型 ✓，只是躺下来了 ✓）：
               机头 (21.4,12) · 后上角 (3.6,3) · 尾槽 (8.4,12) · 后下角 (3.6,21) ✓
             走描边、不填充 ✓ —— 和这一行里别的图标**同一种画法** ✓
             （`stroke-width` 也用同一个 1.8 ✓，粗细才一致 ✓）。 -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.4 12 3.6 21 8.4 12 3.6 3z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 隐藏的文件输入：拍照 / 相册分开两个，
       capture="environment" 才会直接唤起后置相机而不是相册 -->
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileGallery" accept="image/*" hidden>
<!-- ★ 文件 / 音频（2026-10-08）✓ —— `accept` 只管"文件选择器默认显示什么" ✓，
     真正的白名单在服务端 ✓（这里放宽没有安全含义 ✓）。 -->
<input type="file" id="fileDoc" hidden
       accept=".txt,.md,.csv,.json,.pdf,.doc,.docx,.xls,.xlsx">
<input type="file" id="fileAudio" accept="audio/*" hidden>

  <!-- ⚠️ 灯箱原来在这儿 ✗→✓（2026-10-11）—— 见下面顶层的那个 ✓ -->
</div>

<!-- 管家设置：**三屏** ✓（列表 / 改资料 / 编一档状态），见 #settings 那套 -->
<!-- ⚠️ 都不放返回箭头 ✓ —— 用户定的："也是不要<，然后手势可返回" ✓ -->
<!-- ⚠️ 报给原生的屏名一律是 'settings' ✓（见 __goBack / openAgentSettings 的注释 ✓） -->
<div class="screen ascreen" id="agent"><div class="abody" id="agentBody"></div></div>
<div class="screen ascreen" id="agentEdit"><div class="abody" id="agentEditBody"></div></div>

<!-- ★ 组件收纳页（id 仍叫 `workshop` ✓）—— 群聊左滑 / 点猫回来进的就是这一屏。
     它展示**这个群自己**的组件（服务端按 group_id 分目录 ✓），
     空的时候就是"尚未创建组件" ✓。
     ⚠️ 报给原生的屏名走 pushScreen ✓，这里不用管 ✓。
     ⚠️ 这一屏**没有顶栏** ✓：返回靠右滑 / 点猫 ✓，也没有任何管理入口 ✓
        （2026-10-22 用户定的：管理也不做了 ✓，这里只看 ✓）。 -->
<div class="screen ascreen" id="workshop">
  <!-- ★ **顶部一个字都没有、左上角一个按钮都没有** ✗→✓（用户 2026-10-08：
       「进入后，整个界面没有任何分割，纯然一体」✓）。
       原来这里有个 `header.sub`（返回箭头 + "创意工坊" + 调整位置的十字 ✓）——
       整个删了 ✓：返回靠**右滑** ✓，调整位置靠**长按拖动** ✓。
       ★ 2026-10-22：右上角那颗「管理组件」⋯ 也删了 ✓ —— 纯展示 ✓。 -->
  <div class="abody" id="wsBody"></div>
</div>


<!-- ★ 单个组件页 —— **纯预览、没有任何 chrome** ✓（2026-10-08 定的）——
     返回靠右滑 ✓；组件的删 / 改名 / 导出 / 导入都在收纳页右上角的 ⋯ 里 ✓。
     名字由组件自己显示 ✓。 -->
<div class="screen ascreen" id="compView">
  <div class="cpwrap" id="compWrap"></div>
</div>

<!-- ★ **左滑的提示条** ✓（用户 2026-10-09 定的：「从群聊主界面左滑进入组件界面时，
     也要有提示『继续左滑进入创意工坊』和滑入阈值」✓）。
     ⚠️ 它是**一根独立的条** ✓，不是哪一屏的一部分 ✗ ——
        它要在收纳页从右边滑进来的过程中一直看得见 ✓。
     它 `pointer-events:none` ✓（见 CSS ✓）—— 绝不抢手势 ✓。 -->
<div id="pullHint"></div>

<!-- 设置 -->
<div class="screen" id="settings">
  <header class="sub">
    <!-- 用 SVG 而不是文字字符 "<"：字体里的尖括号形状固定，模仿不出微信那种
         细笔画 + 圆角端点 + 偏窄角度的味道。stroke 用 currentColor，跟随主题。 -->
    <button class="icon-btn back" id="backChat" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>设置</h2>
    <!-- ★ 2026-10-20：刷新按钮**搬去主群聊右上角**了 ✓（用户定的 ✓）。
         这里换回**等宽占位** ✓（40px ✓）—— 右边空着的话，`h2` 会在
         "剩余空间"里居中 ✓，看着偏右 ✓（这正是当初放按钮时顺手解决的那个问题 ✓）。 -->
    <div class="spacer"></div>
  </header>
  <div class="body">
    <!-- ★★ **行序 2026-10-24 用户定的**（原话：「顺序：我的，管家，空间，主题，背景，
         模型，邀请码，检查更新」✓）—— 八行**一张卡** ✓，退出两行仍单独一张卡 ✓。
         ⚠️ 这条注释取代之前所有"行序"老注释 ✓（2026-10-06 / 10-08 / 10-09 那几条 ✓）——
            顺序以**这里**为准 ✓，再改就改这里 ✓。 -->

    <div class="sec-g">
      <div class="grp gcard">
    <div class="item" data-act="shell"><span class="ico" data-ico="user"></span><span class="k">我的</span><span class="v" id="vMe"></span><span class="chev" data-chev></span></div>
    <div class="item" data-act="agentprofile"><span class="ico" data-ico="bot"></span><span class="k">管家</span><span class="v" id="vAname"></span><span class="chev" data-chev></span></div>
    <div class="item" data-act="gname"><span class="ico" data-ico="space"></span><span class="k">空间</span><span class="v" id="vGname"></span><span class="chev" data-chev></span></div>
    <!-- ★ 主题（2026-10-19）：三套可选（夜阑 / 奶霜 / 林深 ✓），选完立即生效 ✓。
         ⚠️ 只存这台设备、按用户 id 分开 ✓，不进服务端、不给空间里的别人 ✓。 -->
    <div class="item" data-act="theme"><span class="ico" data-ico="palette"></span><span class="k">主题</span><span class="v" id="vTheme"></span><span class="chev" data-chev></span></div>
    <!-- ★ 聊天背景（2026-10-19）：**每个空间一份** ✓（存 `var/background/g<群号>/` ✓）——
         和上面那个"主题"不是一回事 ✗（主题是**这台设备**的 ✓）。 -->
    <div class="item" data-act="bg"><span class="ico" data-ico="image"></span><span class="k">背景</span><span class="v" id="vBg"></span><span class="chev" data-chev></span></div>
    <!-- ★ 「模型」**只有管理员看得见** ✓（`renderSettings` 按 `me.is_admin` 显示 ✓）——
         藏起来只是**体验** ✓，闸门在 `/api/models/*` 的 `require_admin` ✓。 -->
    <div class="item" data-act="models" id="rowModels" style="display:none"><span class="ico" data-ico="layers"></span><span class="k">模型</span><span class="v" id="vModels"></span><span class="chev" data-chev></span></div>
    <!-- ★ 邀请码：点了是**复制** ✓（满员时说的话也一样 ✓）；右边那一格
         **异步填** ✓（`refreshSpaceInfo` ✓）—— "满员没有"要问服务端 ✓。 -->
    <div class="item" data-act="invite"><span class="ico" data-ico="link"></span><span class="k">邀请码</span><span class="v" id="vInvite"></span><span class="chev" data-chev></span></div>
    <!-- 手动查更新。自动检查是"开 App 时问一次"；这一条随时能问。右边是当前壳的版本号。 -->
    <div class="item" data-act="update"><span class="ico" data-ico="refresh"></span><span class="k">检查更新</span><span class="v" id="vAppVer"></span><span class="chev" data-chev></span></div>

      </div>
    </div>

    <div class="sec-g">
      <div class="grp gcard quit">
    <!-- ★ **退出当前空间**（2026-10-09 用户定的 ✓，原话：
         「邀请码和退出当前空间（**红色字体居中在退出登录上面**）回到设置页」✓）。 -->
    <div class="item" data-act="leave"><span class="k danger">退出当前空间</span></div>
    <div class="item" data-act="logout"><span class="k danger">退出登录</span></div>

      </div>
    </div>

  </div>
</div>

<!-- ★ 2026-10-19：**聊天背景设置** —— 设置页「聊天背景」那一行进这里 ✓。
     ⚠️ 它是一屏整屏子页 ✓ → **报给原生的屏名必须是 `'settings'`** ✗——
        靠的是 `_OTHER_SCREENS` 里列上 `#bgSet` ✓（`tellTop` 会现算 ✓），
        并在 `__goBack` 里加一支 ✓。漏一处，第一次返回什么都不发生、
        第二次直接退 App ✗（见 `android-back-key-only-knows-settings` ✓）。 -->
<div class="screen ascreen" id="bgSet">
  <header class="sub">
    <button class="icon-btn back" id="bgBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>背景</h2>
    <div class="spacer"></div>
  </header>
  <div class="abody" id="bgBody"></div>
</div>

<!-- ★ 2026-10-19：**主题设置** —— 设置页「主题」那一行进这里 ✓。
     ⚠️ 和 `#bgSet` 一样是一屏整屏子页 ✓ → 必须列进 `_OTHER_SCREENS` ✓、
        并在 `__goBack` 里加一支 ✓，否则安卓返回键第一下没反应 ✗
        （见 `android-back-key-only-knows-settings` ✓）。 -->
<div class="screen ascreen" id="themeSet">
  <header class="sub">
    <button class="icon-btn back" id="themeBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>主题</h2>
    <div class="spacer"></div>
  </header>
  <div class="abody" id="themeBody"></div>
</div>
<!-- 背景图选择器 —— 只收图片 ✓；真正的白名单在服务端 ✓。 -->
<input type="file" id="fileBg" accept="image/*" hidden>
<!-- 读图测试用的选图器 ✓ —— 在「模型 → 读图」那块半屏板子里用 ✓
     （和背景那个分开 ✓，同一张图在两个 input 里互不影响 ✓）。 -->
<input type="file" id="fileVision" accept="image/*" hidden>

<!-- ★ 2026-10-11：**模型池** —— 原来它是另一个服务（8722）的一整张网页 ✓，
     2026-10-11 并进这个 App ✓（见 `chat/app/models/__init__.py` ✓）。
     管理员专属 ✓；那一行的入口在「设置」里 ✓（只有管理员看得见 ✓）。 -->
<div class="screen" id="models">
  <header class="sub">
    <button class="icon-btn back" id="modelsBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>模型</h2>
    <button class="icon-btn plain" id="modelsAdd" aria-label="添加模型">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
  </header>
  <div class="body" id="modelsBody"></div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>

<!-- ★ 确认框（2026-10-07 深夜）—— 用户定的：删东西不要"按钮上改字"那种提示，
     「只需要删除的时候弹出个框提示一下，二次确认就行」✓。 -->
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<!-- ★ 居中那张"进来时发生了什么"的小卡片 ✓（见 CSS 里 `.notice` 那段 ✓）——
     它会自己消失 ✓（`showNotice` 里那个计时器 ✓），**不需要点** ✓。 -->
<div class="notice" id="notice"></div>
<!-- ⚠️ 这里原来挂着一张「长按消息弹出来的小卡片」（`div.msgcard#msgcard` ✓）——
     **2026-10-11 整个删了** ✗→✓（用户：「长按消息不再有小卡片，就是默认系统的
     复制行为」✓）。长按现在直接交给浏览器那套 ✓（气泡的 CSS 把选择打开了 ✓，
     见 app.css 那段 ✓），引用搬到了**右滑** ✓（见 05-settings.js ✓）。
     那一套（卡片 + "自由复制"那个盖上去的文本框）连 JS、CSS 一起删干净了 ✓ ——
     留着是死代码 ✓，而且下次有人会照着它去改一个不存在的东西 ✓。 -->

<!-- ★★ 图片大图查看（灯箱）—— **必须在顶层，不能塞进任何一屏里** ✗→✓（2026-10-11）
     用户报的：「点击一次图片后，**返回主群聊变成了那张图片**」✓ —— 就是它 ✗。

     ⚠️ **根因是层叠上下文** ✗：它原来住在主群聊那一屏（`div.screen#chat`）**里面** ✓，
        而 `.screen` 是 `position:fixed` ✓ —— 那本身就**自成一个层叠上下文** ✓ →
        灯箱那个 `z-index:80` **只在那一屏内部有效** ✗，跟别的屏比不了 ✓。
        于是（用户在**工坊**里点图 ✓，工坊是 22）：灯箱**真的亮了** ✓，
        但整块被压在工坊底下 ✓ → **看不见** ✗（"点了没法放大"）。
        更要命的是那个 `.on` **一直挂着** ✓ —— 一退回主群聊 ✓，工坊一关 ✓，
        群聊那一屏露出来 ✓ → 那个亮着的灯箱**当场现身** ✓ → "主群聊变成了那张图片" ✓。

     ⚠️ **教训**：`position:fixed` 的屏，自成一格 ✓ —— 凡是"要盖在所有东西上面"的
        东西 ✓（灯箱 / toast / 浮卡 / 弹层 ✓），**都必须挂在 body 底下** ✗，
        塞进任何一屏里都只是在那一屏内部称王 ✓。
        `tools/check-runtime.sh` 那道"body 底下只许有这几样"的闸，
        就是为了逮住这一类 ✓（它管的正是这个形状 ✓）。

     ⚠️⚠️ **注释里别写字面标签** ✗→✓（2026-10-11，写完当场被自己绊了一跤）——
        这段原来写的是带尖括号的 `div class="screen" id="chat"` ✓，
        而那道闸是用**正则扫 dump 出来的 DOM** ✓（注释在 `--dump-dom` 里是**原样保留**的 ✓）
        → 它把注释里那串字**当成真标签**数了一遍 ✓ →
        顶层元素凭空多出一个 ✓、还把后面的深度算歪 ✓。
        所以这里一律写成 `div.screen#chat` 这种**不带尖括号**的写法 ✓。 -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="">
  <div class="bigletter" id="lightboxTxt" hidden></div>
  <!-- ★ **保存到相册** ✗→✓（2026-10-11 用户：「需要保存」）——
       网页自己**做不到** ✗（`/media` 要同源 cookie ✓、WebView 里也没有下载器 ✓）→
       这个按钮只是**喊一声原生** ✓（`LifeGuardNative.saveImage` ✓）。
       ⚠️ 它**不是**"下载到文件夹" ✓ —— 是进**系统相册**（Pictures/LifeGuard ✓），
          手机上"保存图片"就是这个意思 ✓。
       ⚠️ 打开的是 `blob:` 那种（自己刚发、还在传的 ✓）时会**藏起来** ✓ ——
          原生拿不到 blob ✓，留一个点了没反应的按钮更糟 ✗（见 openLightbox ✓）。 -->
  <button class="lbsave" id="lightboxSave" type="button" hidden>保存到相册</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
