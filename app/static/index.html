<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget：让键盘弹出时**收缩内容**而不是把页面顶上去。
     不写这个的话，安卓 WebView 会把输入框推到看不见的地方。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#171116">
<script>
  // ★ 2026-10-19：先把上次用的主题贴上 ✓ —— 奶霜/林深用户不必先闪一下深色底 ✓。
  //   登录后 `syncThemeForUser()` 会按账号换成这个人自己的那套 ✓。
  try {
    var _t = localStorage.getItem('lg_theme');
    if (_t === 'light') _t = 'cream';   // 旧版本存过的名字
    if (_t === 'cream' || _t === 'forest') document.documentElement.dataset.theme = _t;
  } catch (e) {}
</script>
<title>生活管家</title>
<link rel="stylesheet" href="/static/app.css">
<!-- ★ 2026-10-30：顶栏群名用的「站酷快乐体」（只给群名，正文不换字体 ✓）。
     字体拆成 unicode-range 子集，浏览器只下名字里用到的几个（每个 ~25KB ✓）。 -->
<link rel="stylesheet" href="/static/fonts/zcool-kuaile/index.css">
</head>
<body>

<!-- ★ 2026-10-20：**开局加载页** ✓ —— 从第一帧就盖住整屏 ✓，
     直到「消息画完 + 背景图解码完 + 至少 0.5 秒」才撤 ✓（见 01-core.js 的 `_bootReady` ✓）。
     ⚠️ **它不带 `hidden`** ✗ —— 以前那个转圈是藏着的、200ms 后才亮 ✓，
        所以慢的时候会先露一截空白 / 深色底 ✓；加载页反过来：**先亮着** ✓。
     ⚠️ 颜色全部走主题变量 ✓（`--bg` / `--text` / `--accent` / `--line` ✓）——
        夜阑 / 奶霜 / 林深三套自动跟着换 ✓，不用另写一份 ✓。 -->
<div id="boot" role="status" aria-label="正在加载生活管家">
  <div class="boot-aurora" aria-hidden="true"></div>
  <div class="boot-grid" aria-hidden="true"></div>
  <div class="boot-main">
    <div class="boot-mark" aria-hidden="true">
      <!-- 屋檐 + 门 + 一颗小星光 ✓ —— 和 App 里其它图标同一套画法（细描边、圆端点 ✓） -->
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 23.5 24 11.5l13.5 12"/>
        <path d="M14 23v12.5h20V23"/>
        <path d="M20 35.5v-7.5h8v7.5"/>
        <path d="M35.6 9.2l1.05 2.75 2.75 1.05-2.75 1.05-1.05 2.75-1.05-2.75-2.75-1.05 2.75-1.05z"
              fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="boot-title">生活管家</div>
    <div class="boot-slogan">一个越用越懂你的管家</div>
  </div>
  <div class="boot-foot">
    <div class="boot-bar" aria-hidden="true"><i></i></div>
    <div class="boot-tip">正在准备你的空间…</div>
  </div>
</div>

<!-- 登录 -->
<div class="screen" id="login">
  <!-- ★ 2026-10-09：**照壳原来那一版重做** ✗→✓（用户：「登录界面和注册界面
       之前保持一致，现在不对」✓）。版式全部照抄（`tools/lifeguard-shell.py`
       的 `renderLogin` ✓）：
         · hero 在**卡片外面**（大标题 + 一句广告词 ✓）
         · 每个输入框**上面有 label** ✓（不是光靠 placeholder ✓）
         · 注册时**内测码排第一** ✓（它是进门凭证 ✓）
         · 错误**在按钮下面** ✓，切换那行在最后 ✓
         · 文案也照抄：「还没有账号？创建一个」/「已有账号，去登录」✓ -->
  <div class="wrap">
    <div class="hero">
      <div class="t">生活管家</div>
      <div class="s">一个越用越懂你的管家</div>
    </div>
    <div class="card">
      <label class="regonly" id="lBeta" hidden>内测码</label>
      <input class="field regonly" id="betaCode" placeholder="请填写内测码"
             autocapitalize="off" autocomplete="off" hidden>
      <label for="u">用户名</label>
      <input class="field" id="u" placeholder="用户名" autocapitalize="off" autocomplete="username">
      <label for="p">密码</label>
      <input class="field" id="p" type="password" placeholder="密码" autocomplete="current-password">
      <label class="regonly" id="lP2" hidden>重复密码</label>
      <input class="field regonly" id="p2" type="password" placeholder="再输一遍"
             autocomplete="new-password" hidden>
      <button class="btn-primary" id="doLogin">登录</button>
      <div class="err" id="loginErr"></div>
      <div class="swap"><b id="authSwap">还没有账号？创建一个</b></div>
    </div>
  </div>
</div>

<div class="screen" id="init">
  <!-- ★ 2026-10-09 用户定的两件事 ✗→✓：
       · 「第一次登录时的新建或加入生活空间也改名空间」✓
       · 「对空间的介绍去掉，界面简洁」✓ →
         原来那张"生活空间是什么"的浮卡**整个删了** ✓（点按钮直接进表单 ✓）。 -->
  <!-- ★ 2026-10-09 收拾过 ✗→✓（用户：「比较朴素…要那种简约大气又不会太简陋」✓）——
       做法不是"再糊一层装饰" ✗，而是**把它对齐到登录那一屏的版式** ✓：
       同一个 `.wrap` 卡片 ✓、同一套 `.hero .t/.s` 大小标题 ✓（他自己的规矩：
       同构界面必须长一样 ✓）。原来这里是三行裸文字 + 一颗按钮 ✓，
       什么都没有垫着 ✓ —— 那正是"简陋"的来源 ✓。 -->
  <div class="wrap">
    <div class="hero">
      <div class="t">欢迎使用生活管家</div>
      <div class="s">继续使用请先</div>
      <!-- ⚠️⚠️ **按钮必须在 `.hero` 里面** ✗→✓（2026-10-10 量出来的）——
           我这天早些时候把它挪到了 hero **外面** ✗：那样一来
           `align-items:center`（弹性盒子的居中 ✓）根本管不到它 ✓，
           而它是个 `inline-block` ✓ —— `margin:0 auto` 对**行内级**盒子无效 ✗✗
           → 它就**贴左**了 ✓（量出来的中点 196 ✓，卡片中点 250 ✓，差 54px ✓）。
           放回 hero 里面 = 它成了一个 flex item ✓ → 居中由 `align-items` 负责 ✓，
           和标题/副标题**同一个机制** ✓（以后不用再各管各的 ✓）。
         ⚠️ 原来的通栏按钮**看不出这个错** ✗（满宽一定是"居中"的 ✓）——
           这次改成"贴字的紧凑按钮" ✓ 才把它露出来 ✓。 -->
      <button class="btn-primary" id="initGo">＋&nbsp;&nbsp;新建或加入一个空间</button>
    </div>
    <!-- ⚠️ 这里有过一行「退出登录」（2026-10-09 加的 ✓，理由是"没有空间的人
         换不了号" ✓）—— 用户当天就让撤了 ✓（「得得，把退出登录去掉」✓）。
         ⚠️ **那个理由本身是真的** ✗（壳那版也防过这件事 ✓）：还没有空间的人
            确实进不到设置页 → 也就没有登出入口 ✓。撤了之后**这个缺口又回来了** ✓，
            先记在这儿 ✓，他哪天说"换不了号"就是这一条 ✓。 -->
  </div>
  <!-- ★ 2026-10-10 用户定的形状 ✓：**两个框 + 底部一颗按钮** ——
       每个框自己头上一行提示 ✓（「新建个空间？」/「加入已有空间？」✓），
       框里是占位提示 ✓（「为空间起个名字」/「输入邀请码」✓）；
       ⚠️ 两颗按钮并排那种**没有了** ✓（原来是一颗"新建"一颗"加入" ✓）——
         他说的是"底部一个按钮" ✓（名字「加入空间」✓，填哪个框就走哪条路 ✓）。 -->
  <div class="introcard" id="introCard" hidden>
    <label class="fld" for="spaceName">新建个空间？</label>
    <input class="field" id="spaceName" placeholder="为空间起个名字" maxlength="32" autocomplete="off">
    <label class="fld" for="joinCode">加入已有空间？</label>
    <input class="field" id="joinCode" placeholder="输入邀请码" maxlength="16"
           autocapitalize="characters" autocomplete="off">
    <!-- ⚠️ 一开始是**灰的** ✓（两个框都空 ✓），填了任意一个才亮 ✓ -->
    <button class="btn-primary" id="spaceGo" disabled>加入空间</button>
  </div>
</div>

<!-- 我的（数据由 JS 画 ✓ 和 `#agent` 一个做法 ✓） -->
<!-- ★ 2026-10-24：「我的」也**加了一条顶栏** ✓（和「聊天背景」「主题」同一套 `header.sub` ✓）——
     原来这一屏只有一张资料卡悬在状态栏下面 ✓，进来第一眼不知道自己在哪 ✓。
     ⚠️ **只有标题、没有返回箭头** ✓ —— 用户定的：「也是不要<，然后手势可返回」✓；
        两边各留一个 40px 占位 ✓ 让标题真居中 ✓（见 CSS `header.sub` 那几条 ✓）。
     ⚠️ 有顶栏之后 `.abody` 的顶距会自己变成 14px ✓（`.ascreen > header.sub ~ .abody` ✓）——
        **不用**另写 ✓。 -->
<div class="screen ascreen" id="me"><header class="sub"><h2>我的</h2><div class="spacer"></div></header><div class="abody" id="meBody"></div></div>
<!-- 改资料（头像 + 昵称 ✓）—— 和管家同一批 class ✓ -->
<div class="screen ascreen" id="meEdit"><div class="abody" id="meEditBody"></div></div>
<!-- 生活空间：改名 / 邀请码 / 退出该空间（用户 2026-10-08 定的三样 ✓） -->
<!-- 自我介绍（≤500 字 ✓，可空 ✓）—— 跟着每一轮进它脑子 ✓ -->
<!-- 别人的那一屏：头像+昵称（和我的、管家同构 ✓）+ 备注 ✓ -->
<div class="screen ascreen" id="peer"><div class="abody" id="peerBody"></div></div>

<!-- 聊天 -->
<div class="screen" id="chat">
  <!-- ★ 2026-10-29 暖光：三团很慢的呼吸光 + 几粒浮尘（纯装饰、不接事件） -->
  <div id="chatAmb" aria-hidden="true">
    <i class="a1"></i><i class="a2"></i><i class="a3"></i>
    <b class="m1"></b><b class="m2"></b><b class="m3"></b>
    <b class="m4"></b><b class="m5"></b><b class="m6"></b>
  </div>
  <header class="top">
    <!-- ★ 2026-10-29：**顶栏只剩空间名和管家的动静** ✓（用户定的 ✓）。
         ☰ 和刷新都拿掉了 ✓ —— 设置改成**右滑**进 ✓（05-settings.js 的手势），
         刷新改成**从顶栏往下拽** ✓（同文件里的 pull 那段）。
         ★ 2026-10-30 第三版：顶栏**只剩一行** ✓ ——
           用户：「猫猫的运动轨迹和群昵称所处一行，不要刻意分开」✓。
           群名（`.info` ✓）和猫的地板（`#catStage` ✓）**压在同一条线上** ✓，
           地板不再把顶栏撑高 ✓；猫的 z 比名字高 ✓ → 走到字上时**在字前面** ✓
           （用户：「如果猫猫运动到昵称位置，猫猫要在昵称前面」✓）。
           ⚠️ `.info` 左右各让 58px ✓ —— 给最左的碗 / 最右的窝腾地方 ✓（名字仍居中 ✓）。
           ⚠️ 第二版"名字住上一行、地板住下一行"**作废** ✓。 -->
    <!-- ★★ 2026-10-31 第七版：**房间里有了墙和地板** ✓
         （用户：「往墙面做点东西吧」✓ —— 上一版我说过"下一步可以往墙面上做
           挂画 / 小窗 / 地毯这类" ✓，他点头了 ✓）。
         全部在**群名和猫的后面** ✓（z-index:0 ✓），一共这几样：
           · **墙纸** ✓ —— 极淡的小圆点 + 从左上洒下来的暖光 ✓（见 app.css 的
             `#catWall::before` ✓）；远看只是一层布纹 ✓，不跟群名抢注意力 ✓
           · 左边一扇**小窗** ✓ —— 暖暮色的天、月牙、星子、远处屋顶的灯、窗台，
             窗台上还摆了一盆**小绿植** ✓；窗里透出一圈暖光 ✓（慢慢呼吸 ✓）
           · 右边一小簇**拍立得** ✓ —— 挂在灯串下面那枚小钉子上，轻轻晃 ✓
             （一张是爱心、一张是爪印 ✓）
           · 地上一块**圆地毯** ✓ —— 铺在名字右边、猫窝左边 ✓，猫走去窝里时
             会踩过它 ✓。★ 画成**椭圆**而不是长条 ✗ —— 长条在地板线上像一根
             搁板；有透视的椭圆才认得出是"躺在地上的毯子" ✓
           · 一条 **9px 的地板** ✓ —— 碗 / 窝 / 猫 / 地毯都站在它上面 ✓。
             ★ 这一条是后来补的 ✓：没有它，上面所有东西都像**贴纸浮在半空** ✗
         ⚠️ 顶栏为了这面墙从 41px 长到 57px ✓ —— **名字和猫还在同一行** ✓，
            只是它们上面多出一截墙 ✓（名字那一行本身没动 ✓）。
         ⚠️ 两边的东西都避开名字那个 250px、**会省略号**的文本盒 ✓
            （左边 9–36px ✓、右边贴右 12px ✓ —— 长名字也压不上来 ✓）。
         ⚠️ 窗和照片都按 `bottom` 定位 ✓（见 app.css ✓）—— 手机上有状态栏
            inset 时它们还是贴着地板走 ✓，不会钻进状态栏 ✓。 -->
    <div id="catWall" aria-hidden="true">
      <!-- 地板 ✓（★ 第七版补的 ✓）—— 碗 / 窝 / 猫 / 地毯都站在这条上 ✓。
           没有它，窗和拍立得会像"贴纸浮在半空"✗（第一版看着就发飘 ✓）。 -->
      <div class="cw-floor"></div>
      <!-- 左：小窗 ✓ -->
      <div class="cw-win">
        <svg viewBox="0 0 30 30" focusable="false">
          <defs>
            <linearGradient id="cwSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#493349"/>
              <stop offset=".42" stop-color="#7c4a5c"/>
              <stop offset=".72" stop-color="#c1735f"/>
              <stop offset="1" stop-color="#f2b184"/>
            </linearGradient>
            <radialGradient id="cwGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffd59a" stop-opacity=".40"/>
              <stop offset=".6" stop-color="#ffcf92" stop-opacity=".12"/>
              <stop offset="1" stop-color="#ffcf92" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- 窗里透出来的暖光 ✓（呼吸 ✓，`.cw-win-glow` 见 app.css） -->
          <ellipse class="cw-win-glow" cx="15" cy="15.5" rx="19" ry="16"
                   fill="url(#cwGlow)"/>
          <!-- 外框（拱顶 ✓） -->
          <path d="M3 13 C3 6.6 27 6.6 27 13 L27 25.6 L3 25.6 Z"
                fill="#f7e2c8" stroke="#b98d5f" stroke-width="1.15"/>
          <!-- 玻璃（暮色）✓ -->
          <path d="M5.1 13.4 C5.1 8.5 24.9 8.5 24.9 13.4 L24.9 23.4 L5.1 23.4 Z"
                fill="url(#cwSky)"/>
          <!-- 月牙 ✓ -->
          <path d="M19.6 11.1 a2.1 2.1 0 1 0 2.2 3.1 a2.7 2.7 0 1 1 -2.2 -3.1 Z"
                fill="#ffe9bd"/>
          <!-- 星子 ✓（各自闪 ✓） -->
          <g fill="#fff4d9">
            <path class="cw-star s1" d="M8.4 13.2 l.42 1.02 1.1 .08 -.84 .76 .26 1.1 -.94 -.56 -.94 .56 .26 -1.1 -.84 -.76 1.1 -.08 Z"/>
            <circle class="cw-star s2" cx="12.4" cy="10.9" r=".5"/>
            <circle class="cw-star s3" cx="7.2" cy="17.6" r=".42"/>
            <circle class="cw-star s4" cx="12.9" cy="19.1" r=".34"/>
          </g>
          <!-- 远处的屋顶 + 两盏暖灯 ✓（"有人住在外面"的那种安心感 ✓） -->
          <g>
            <path d="M4.6 20.5 L8.2 17.9 L11.8 20.5 L11.8 23.4 L4.6 23.4 Z"
                  fill="#5a3547" opacity=".75"/>
            <path d="M13.4 21.4 L16.6 19.2 L19.8 21.4 L19.8 23.4 L13.4 23.4 Z"
                  fill="#5a3547" opacity=".6"/>
            <path d="M21.8 21.9 L24.6 20 L25 21.9 L25 23.4 L21.8 23.4 Z"
                  fill="#5a3547" opacity=".5"/>
            <rect x="7.1" y="20.6" width="1.15" height="1.3" rx=".2"
                  fill="#ffcf86" opacity=".9"/>
            <rect x="15.6" y="21.8" width="1" height="1.1" rx=".2"
                  fill="#ffcf86" opacity=".75"/>
          </g>
          <!-- 窗棂 ✓ -->
          <path d="M15 8.9 L15 23.4" stroke="#f7e2c8" stroke-width="1.05"/>
          <path d="M5.1 16.4 L24.9 16.4" stroke="#f7e2c8" stroke-width="1.05"/>
          <!-- 玻璃反光 ✓ -->
          <path d="M6.8 21.9 L10.8 13.6" stroke="#fff" stroke-width=".9"
                opacity=".13" stroke-linecap="round"/>
          <!-- 窗台上那盆小绿植 ✓（★ 第七版补 ✓）—— 只有 5px 宽，
               但一下就把"窗"变成"有人住的窗" ✓（这是最便宜的一笔细节 ✓） -->
          <g class="cw-plant">
            <path d="M20.0 22.0 c-.2 -1.5 -1.05 -2.35 -2.1 -2.65 c.2 1.15 .9 2.25 2.1 2.65 Z"
                  fill="#9dbb80" stroke="#6f8f58" stroke-width=".3"/>
            <path d="M22.6 22.0 c.2 -1.6 1.1 -2.45 2.15 -2.7 c-.25 1.2 -.95 2.3 -2.15 2.7 Z"
                  fill="#8fae74" stroke="#6f8f58" stroke-width=".3"/>
            <path d="M21.3 21.9 c-.55 -1.4 -.55 -2.55 -.2 -3.35"
                  fill="none" stroke="#6f8f58" stroke-width=".4" stroke-linecap="round"/>
            <path d="M21.15 22.2 h2.35 l-.4 3.15 h-1.55 Z"
                  fill="#c9805f" stroke="#9a5a45" stroke-width=".35"/>
            <path d="M19.85 22.95 h4.95" stroke="#e3a183" stroke-width=".35" opacity=".8"/>
          </g>
          <!-- 窗台 ✓ -->
          <rect x="1.2" y="25.4" width="27.6" height="2.8" rx="1.3"
                fill="#fbe9d1" stroke="#b98d5f" stroke-width=".9"/>
          <path d="M1.2 26.2 H28.8" stroke="#fff" stroke-width=".5" opacity=".5"/>
        </svg>
      </div>
      <!-- 右：一小簇拍立得 ✓（挂在一枚小钉子上，慢慢晃 ✓） -->
      <div class="cw-pics">
        <svg viewBox="0 0 40 24" focusable="false">
          <!-- 钉子 + 两根线 ✓ -->
          <path d="M20 2.4 L14.6 7.9" stroke="#b08a63" stroke-width=".55"
                stroke-linecap="round"/>
          <path d="M20 2.4 L29.6 8.6" stroke="#b08a63" stroke-width=".55"
                stroke-linecap="round"/>
          <circle cx="20" cy="2.2" r=".85" fill="#a8845a"/>
          <circle cx="20" cy="2.2" r=".32" fill="#e8c9a8" opacity=".7"/>
          <!-- 爱心那张 ✓（歪 6° ✓） -->
          <g class="cw-photo-a" transform="rotate(-6 13 17)">
            <rect x="4.4" y="7.4" width="17" height="16.6" rx="1.2"
                  fill="#fffaf2" stroke="#d9b491" stroke-width=".8"/>
            <rect x="6.3" y="9.2" width="13.2" height="10.1" rx=".7" fill="#f5c9bd"/>
            <path d="M12.9 16.4 c-1.35 -1.55 -4.2 -.55 -3.4 1.6
                     c.5 1.35 2.35 2.35 3.4 3.1 c1.05 -.75 2.9 -1.75 3.4 -3.1
                     c.8 -2.15 -2.05 -3.15 -3.4 -1.6 Z" fill="#e9756c"/>
            <path d="M8.6 22.4 h9.2" stroke="#dcc0a3" stroke-width=".7"
                  stroke-linecap="round" stroke-dasharray="1.1 1.3"/>
            <path d="M11.4 20.2 h3.6" stroke="#e2cbb2" stroke-width=".55"
                  stroke-linecap="round"/>
            <rect x="13.1" y="6.9" width="3.1" height="2.2" rx=".6" fill="#d9ac7e"
