<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget：让键盘弹出时**收缩内容**而不是把页面顶上去。
     不写这个的话，安卓 WebView 会把输入框推到看不见的地方。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<title>生活管家</title>
<style>
  :root, [data-theme="dark"] {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b;
    --text:#e6e8ee; --muted:#8b93a7; --line:#262b36;
    --accent:#6ea8ff; --accent-bg:#1e3a5f; --on-accent:#07131f;
    --agent:#9dd0aa; --danger:#ff6b6b;
    /* 系统留白。**由网页自己做主**——原生壳只上报数字（window.__onInsets），
       这里决定怎么用。这样调布局改网页就行，不用重装 App。
       浏览器里（没有原生壳）退回 CSS 的 env()。 */
    --inset-top: env(safe-area-inset-top, 0px);
    --inset-bottom: env(safe-area-inset-bottom, 0px);
    --kb: 0px;                    /* 仅浏览器下的键盘兜底，App 里原生已算进 inset-bottom */
  }
  [data-theme="light"] {
    --bg:#f5f6fa; --panel:#ffffff; --panel2:#eef0f6;
    --text:#14161c; --muted:#5a637a; --line:#dde1ea;
    --accent:#2f6fd0; --accent-bg:#dce8fb; --on-accent:#ffffff;
    --agent:#2f8a52; --danger:#c0392b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overscroll-behavior:none; }
  body {
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; background:none; color:inherit; }
  input,textarea { font:inherit; }

  /* 每个界面都是固定铺满。用 dvh 而不是 vh：地址栏收起时不会留白 */
  .screen { position:fixed; inset:0; height:100dvh; display:none; flex-direction:column; background:var(--bg); }
  .screen.on { display:flex; }

  /* ── 登录 ── */
  #login { justify-content:center; align-items:center; padding:24px; }
  #login .wrap { width:min(360px,100%); padding:26px 22px; background:var(--panel);
                 border:1px solid var(--line); border-radius:18px; }
  #login .logo { width:64px;height:64px;border-radius:50%;background:var(--accent-bg);
                 display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
                 font-size:26px;color:var(--accent); }
  #login h1 { margin:0 0 4px; font-size:20px; text-align:center; }
  #login .sub { margin:0 0 22px; color:var(--muted); font-size:13px; text-align:center; }
  .field { width:100%; padding:13px 14px; margin-bottom:10px; background:var(--panel2);
           border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:16px; }
  .field:focus { outline:none; border-color:var(--accent); }
  .btn-primary { width:100%; padding:14px; background:var(--accent); color:var(--on-accent);
                 font-weight:600; font-size:16px; margin-top:6px; border-radius:12px; }
  .btn-primary:disabled { opacity:.45; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-bottom:6px; text-align:center; }

  /* ── 聊天 ── */
  header.top { background:var(--panel); border-bottom:1px solid var(--line);
               /* ★ 左右内边距 **8px** ✓（原来 16px ✗）—— 2026-10-06 用户：
                  "以 `<` 距离左侧的距离为基准……全都保持一致" ✓。
                  设置页（`header.sub` ✓）一直是 8px ✓，这里也收成 8px ✓，
                  两个顶栏的"边距"才是同一个数 ✓。
                  左右都是 8px ✓ → **中间那块照旧居中** ✓（对称没破 ✓）。 */
               padding:calc(var(--inset-top) + 12px) 8px 12px;
               display:flex; align-items:center; gap:10px; flex-shrink:0; }
  /* 群名居中：左侧汉堡宽度靠一个等宽占位元素抵消，
     否则 flex:1 会让标题在"剩余空间"里居中，视觉上是偏右的。 */
  header.top .spacer { width:40px; flex-shrink:0; }
  header.top .info { flex:1; min-width:0; text-align:center; }
  header.top .gname { font-size:17px; font-weight:600; overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
  header.top .status { display:flex; align-items:center; justify-content:center;
                       gap:6px; font-size:12px; color:var(--muted); margin-top:2px; }
  /* ⚠️ **必须显式盖回来** ✗ —— 上面那句是作者样式 ✓，
     而 `[hidden]{display:none}` 只是浏览器默认样式 ✓ → 它赢不了 ✗。
     少了这一条，"关掉待机"之后状态条**照样在**（只是里面没字 ✓）。
     （同一个坑 `#qbar[hidden]` 那条注释里已经写过一次 ✓。） */
  header.top .status[hidden] { display:none; }
  /* 静息也是绿点——它一直在"窥屏"，用灰点会显得像离线 */
  header.top .dot { width:7px;height:7px;border-radius:50%;background:var(--agent);flex-shrink:0; }
  header.top .status.s-idle .dot { opacity:.6; }
  header.top .status.s-thinking, header.top .status.s-typing { color:var(--agent); }
  header.top .status.s-thinking .dot, header.top .status.s-typing .dot { background:var(--agent); }
  header.top .status.s-lurking { color:var(--accent); }
  header.top .status.s-lurking .dot { background:var(--accent); }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  header.top .status.s-thinking .dot, header.top .status.s-typing .dot { animation:pulse .7s infinite; }
  .icon-btn { width:40px;height:40px;display:flex;align-items:center;justify-content:center;
              color:var(--muted); flex-shrink:0; font-size:20px; }
  /* ☰ 往左挪一点点 ✓ —— 2026-10-06 用户："距离左边间距略微小一些，
     **不要影响群昵称和关键状态的位置**" ✓。
     ⚠️ **用 `transform`，不能用负 margin** ✗→✓ ——
       负 margin 会**改变这个盒子的布局宽度** ✓ → 中间那块跟着偏 ✗
       （上一轮那个 `margin-left:-8px` 就是这么把群名顶偏 4px 的 ✓，
        用户一眼就看出来了 ✓）。
       `transform` 只挪"画在哪儿"✓，**完全不参与布局** ✓
       → 群名和状态条一个像素都不动 ✓，而 ☰ 自己往左 ✓。
     这就是"要动一个东西、又不想动它的邻居"时的标准做法 ✓。 */
  /* ── 三个图标对齐到同一个"离屏边的距离" ✓ ────────────────────────
     用户 2026-10-06："以 `<` 距离左侧的距离为基准，刷新按钮距离右侧、
     设置按钮距离左侧全都保持一致" ✓。

     口径是**墨迹**（眼睛看到的那几笔 ✓），不是盒子 ✗ —— 盒子没人看得见 ✓。

     基准 = 设置页那个 `<`：
       内边距 8px ✓ + 盒子 40px、里面 SVG 22px 居中 → 里面让出 9px ✓
       + 那笔 "<" 的墨迹在 24 格里从 8.5 开始（描边圆头再往外 1 ✓ = 7.5 ✓）
       7.5 ÷ 24 × 22 = 6.875px
       → **8 + 9 + 6.875 ≈ 23.9px** ✓ ← 这就是基准

     ☰：墨迹从 24 格里的 6 开始（圆头 → 5 ✓）= 5 ÷ 24 × 22 = 4.58px
       → 8 + 9 + 4.58 = 21.58 ✗ 比基准近 2.3px → **往右推 2.3px** ✓

     ↻：用得是 Feather 那条 ✓，墨迹几乎顶满 24 格（右边 24 ✓），
       而它画在 19px 的格子里 → 9.5px 的居中让位 + 0 = 9.5px
       → 离右边 8 + 9.5 = 17.5 ✗ 比基准远 6.4px → **往左推 6.4px** ✓

     ⚠️ **都用 `transform`，不用负 margin** ✗ —— 负 margin 会改布局宽度 ✓
        → 中间那块跟着偏 ✗（上一轮那个 `-8px` 就是这么把群名顶偏 4px 的 ✓）。
        `transform` 只挪"画在哪儿"✓，**不参与布局** ✓ → 群名和状态条一动不动 ✓。
     ⚠️ 换了图标或改了尺寸，这三个数要**重算** ✓（算法就在上面 ✓）。 */
  #openSettings { transform: translateX(2.3px); }     /* 墨迹 → 离左 23.9px ✓ */
  #reloadBtn    { transform: translateX(-6.4px); }    /* 墨迹 → 离右 23.9px ✓ */
  /* 创意工坊（右上角）—— 2026-10-07 加 ✓。
     **墨迹跨度和 ☰ 一样**（24 格里 6..18 ✓，描边圆头再往外 1 ⇒ 5..19 ✓）
     → 直接取它的**镜像** ✓：☰ 在左、往右推 2.3px ✓；这个在右、往左推 2.3px ✓。
     ⚠️ **换了图标这个数要重算** ✗ —— 算法在下面那段注释里 ✓。 */
  #openWorkshop { transform: translateX(-2.3px); }

  /* 返回箭头是 SVG（见 HTML），这里只管对齐和颜色 */
  .icon-btn.back { color:var(--text); }
  .icon-btn.back svg { display:block; }
  /* 设置页右上角那个刷新 ✓ —— **和左边的返回箭头同一个大小、同一个颜色** ✓。
     原来写的是一个 `↻` 文字字符 ✗，两个毛病：
       · 字形大小和 SVG 对不上 ✓（20px 的字，视觉上比 22px 的描边小一号 ✓）
       · `.icon-btn` 默认是 `--muted` ✗，比左边那个 `--text` 淡一档 ✓
     两下一夹，一眼就看出左右不对称 ✓（用户 2026-10-06 指的就是这个 ✓）。 */
  .icon-btn.plain { color:var(--text); }
  .icon-btn.plain svg { display:block; }

  #msgs { flex:1; min-height:0; overflow-y:auto; padding:14px; display:flex;
          flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .empty { margin:auto; color:var(--muted); font-size:14px; text-align:center; }
  .row { display:flex; gap:8px; max-width:84%; }
  .row.mine { align-self:flex-end; flex-direction:row-reverse; }
  .row.agent { max-width:92%; }
  .av { width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--panel2);
        color:var(--muted); display:flex;align-items:center;justify-content:center;
        font-size:13px;font-weight:600; }
  .row.agent .av { background:var(--accent-bg); color:var(--agent); }
  .wrap2 { min-width:0; }
  .who { font-size:12px; color:var(--muted); margin-bottom:3px; padding-left:4px; }
  .row.agent .who { color:var(--agent); }
  .row.mine .who { text-align:right; padding-right:4px; }
  .bubble { padding:9px 13px; border-radius:14px; background:var(--panel2);
            word-break:break-word; white-space:pre-wrap; }
  .bubble .at { color:var(--accent); font-weight:600; }
  .row.mine .bubble { background:var(--accent-bg); border-bottom-right-radius:4px; }
  /* 系统提示：居中、灰、无头像无气泡。
     **故障通报必须一眼看出不是管家在说话**——混在气泡里的话，用户会以为
     那是它说的一句怪话，故障就被掩盖过去了。 */
  .sysrow { align-self:center; max-width:86%; font-size:12.5px; color:var(--muted);
            background:var(--panel2); border-radius:10px; padding:6px 12px;
            text-align:center; line-height:1.55; }
  .row.agent .bubble { background:var(--panel); border:1px solid var(--line);
                       border-left:3px solid var(--agent); border-bottom-left-radius:4px; }
  .row:not(.mine):not(.agent) .bubble { border-bottom-left-radius:4px; }
  .time { font-size:11px; color:var(--muted); margin-top:2px; padding:0 4px; }
  .row.mine .time { text-align:right; }

  /* 输入区：底部留出 safe area + 键盘高度 */
  #composer { border-top:1px solid var(--line); background:var(--panel); flex-shrink:0;
              padding:10px 12px calc(10px + var(--inset-bottom) + var(--kb)); }
  /* 微信的排布：[语音] [输入框] [表情] [+ 或 发送]
     有内容时发送按钮**替换掉** + ——这样右边永远只有两个图标，
     输入框不会被挤扁（之前四个图标并排，占位文字都折行了）。 */
  /* ⚠️ **`align-items:center`，不是 `flex-end`** ✗→✓ —— 2026-10-06 用户：
     "保持在底部区域的垂直居中" ✓。
        输入框 `min-height:42px` ✓，而按钮原来 36px ✓ + `flex-end` ✗
        → 按钮贴着**行的底边** ✓ → 它的中心比输入框的中心**低 3px** ✗
        → 看着就是"没对齐" ✓（不量的话很难说清是哪儿不对 ✓）。
        改成居中之后 ✓：行高 = 两者里高的那个（42px ✓），
        按钮在**这一行**里居中 ✓ —— 输入框长到两三行时，按钮仍然居中 ✓
        （用户要的就是这个 "垂直居中" ✓，不是"贴底" ✗）。 */
  #composerRow { display:flex; align-items:center; gap:4px; }

  /* 输入框上方的「正在引用」条。引用是输入状态的一部分，不是消息的一部分——
     所以它在输入区，发完就消失。 */
  #qbar { display:flex; align-items:center; gap:8px; background:var(--panel2);
          border:1px solid var(--line); border-radius:10px; padding:6px 10px;
          margin-bottom:8px; }
  #qbar[hidden] { display:none; }   /* 上面写了 display:flex，得显式盖回来 */
  #qbar .qbody { min-width:0; flex:1; }
  #qbar .qwho { color:var(--accent); font-size:12px; margin-bottom:2px; }
  #qbar .qtext { color:var(--muted); font-size:13px; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  /* 工坊那条引用条**用同一套 class** ✓（`.qbody` / `.qwho` / `.qtext` ✓）——
     只是它是 `#wsQbar` ✓（两屏各有各的 ✓，形状一致 ✓，改一处两边一起变 ✓）。 */
  #wsQbar { display:flex; align-items:center; gap:8px; background:var(--panel2);
            border:1px solid var(--line); border-radius:10px; padding:6px 10px;
            margin:0 12px 6px; }
  #wsQbar[hidden] { display:none; }   /* 上面写了 display:flex，得显式盖回来 */
  #wsQbar .qbody { min-width:0; flex:1; }
  #wsQbar .qwho { color:var(--accent); font-size:12px; margin-bottom:2px; }
  #wsQbar .qtext { color:var(--muted); font-size:13px; white-space:nowrap;
                   overflow:hidden; text-overflow:ellipsis; }
  #qbar .qx { background:none; border:none; color:var(--muted); font-size:15px;
              cursor:pointer; padding:2px 4px; line-height:1; }

  /* 气泡里的引用块（微信是气泡顶部一块浅灰，左侧不描边，整体比正文小一号） */
  .quote { display:block; background:rgba(127,127,127,.16); border-radius:8px;
           padding:6px 9px; margin-bottom:7px; font-size:12.5px; line-height:1.45;
           cursor:pointer; max-width:100%; }
  .quote .qwho { color:var(--accent); font-weight:600; margin-bottom:2px; }
  .quote .qtext { color:var(--muted); white-space:nowrap; overflow:hidden;
                  text-overflow:ellipsis; }
  /* 点了引用条跳到原消息时闪一下，否则用户不知道跳到哪了 */
  .row.flash .bubble { animation:qflash 1.1s ease-out; }
  @keyframes qflash { 0%,100% { box-shadow:none }
                      25% { box-shadow:0 0 0 3px var(--accent); } }
  #text { flex:1; min-width:0; padding:10px 13px; background:var(--panel2);
          border:1px solid var(--line); border-radius:16px; color:var(--text);
          font-size:16px; resize:none; max-height:120px; min-height:42px; line-height:1.4; }
  #text:focus { outline:none; border-color:var(--accent); }
  /* ★ 底部这三个（语音/文字、表情、＋）**大一点点** ✓ —— 2026-10-06 用户：
     "大小略微大一些些" ✓ → 36 → **40px** ✓（+11% ✓，正好和顶栏那几个一样大 ✓）。
     40 也刚好落在输入框的 42px 里 ✓ → 居中的时候上下各留 1px ✓，不挤 ✓。 */
  /* 待发附件条 ✓ —— 缩略图横排、可横向滚动、右上角一个 ✕ 能删 ✓。 */
  #pendbar { display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; }
  /* ⚠️ **必须显式盖回来** ✗ —— 上面那句是作者样式 ✓，
     而 `[hidden]{display:none}` 只是浏览器默认样式 ✓ → 它赢不了 ✗。
     （同一个坑，这个页面上这是第三回了 ✓：`#qbar`、`header.top .status`、这里 ✓。） */
  #pendbar[hidden] { display:none; }
  #pendbar .pend { position:relative; flex:none; }
  #pendbar .pend img { width:64px; height:64px; border-radius:10px;
                       object-fit:cover; display:block; }
  /* 非图片（以后的文件 ✓）：不给缩略图，给一块写着文件名的方块 ✓ */
  #pendbar .pend .fchip { width:64px; height:64px; border-radius:10px;
                          background:var(--panel2); color:var(--muted);
                          display:flex; align-items:center; justify-content:center;
                          font-size:11px; line-height:1.3; padding:4px;
                          text-align:center; word-break:break-all; overflow:hidden; }
  #pendbar .pend .px { position:absolute; top:-6px; right:-6px; width:20px; height:20px;
                       border-radius:50%; background:rgba(0,0,0,.68); color:#fff;
                       font-size:12px; line-height:1; display:flex;
                       align-items:center; justify-content:center; }
  /* 有待发附件 → **发送按钮也要在** ✓（哪怕一个字没打 ✓）；
     但 `+` 继续留着 ✓（还能再加一张 ✓）——
     所以这是**另一个** class ✓，不去动 `hasText` ✓
     （那个管的是"有字才把 + 换成发送" ✓，两件事别混 ✓）。 */
  body.hasPending #send { display:flex; }

  #composerRow .icon-btn { width:44px; height:44px; }
  /* ★ 「表情」和「＋」**再大一点点** ✓ —— 2026-10-06 用户："表情和➕还可以再大些" ✓。
     ⚠️ **只有这两个** ✗ —— 左边那个"语音/键盘"开关按用户的话**不动** ✓，
        所以这里单独给 id ✓，不去改那条通用的 `.icon-btn` ✓
        （改了的话三个一起变大 ✓，那不是他说的 ✓）。 */
  #pickSticker, #pickMedia { width:48px; height:48px; }
  /* 发送按钮：**一个实心圆 + 一枚纸飞机** ✓ —— 2026-10-06 用户：
     "输入文字后的 + 被替换成的发送按钮优化一下显示，也做成 svg，好看些" ✓。
     原来里面是一个 `➤` 文字字符 ✗ —— 和别处那三个一样的问题：
     字形大小、形状都随字体 ✗，放在一个规整的圆里就显得"不齐" ✓。
     现在换成 SVG ✓，大小和旁边那几个图标同一个量级 ✓
     （圆 40、里面 20 ✓ —— 实心圆本来就该比描边图标**小一点点** ✓，
       一样大的话会显得比它们重 ✗）。 */
  /* ★ **不要那个蓝圆了** ✗→✓ —— 2026-10-06 用户："不要蓝色圆圈，只要里面的纸飞机 svg" ✓。
     底色去掉 ✓，只留一枚**实心**的纸飞机（`--accent` 蓝 ✓）——
     "这是个动作"这件事由**颜色**来说就够了 ✓，不需要再垫一个圆 ✗。
     盒子仍然 44px ✓ —— 和旁边那三个**同一个盒子** ✓，
     所以它们在一条线上对齐 ✓（去掉圆之后，对齐就是盒子的事 ✓）。
     为什么这里是**实心**、别的都是描边 ✗：它是这一行里唯一的**主操作** ✓，
     实心在 20 出头的大小上也比描边清楚 ✓。 */
  #send { display:none; width:44px;height:44px;background:none;
          color:var(--accent); align-items:center;justify-content:center;
          flex-shrink:0; }
  #send svg { display:block; }
  /* 有文字：显示发送、藏起 + */
  body.hasText #send { display:flex; }
  body.hasText #pickMedia { display:none; }

  /* 麦克风/键盘图标互斥显示 */
  #modeToggle .ico-kbd { display:none; }
  body.voiceMode #modeToggle .ico-mic { display:none; }
  body.voiceMode #modeToggle .ico-kbd { display:block; }

  /* 语音模式：输入框换成"按住说话" */
  #holdTalk { display:none; flex:1; height:44px; border-radius:12px;
              background:var(--panel2); border:1px solid var(--line);
              color:var(--text); font-size:15px; user-select:none;
              -webkit-user-select:none; touch-action:none; }
  #holdTalk.rec { background:var(--danger); border-color:var(--danger);
                  color:#fff; font-weight:600; }
  body.voiceMode #text { display:none; }
  body.voiceMode #holdTalk { display:block; }
  /* 语音模式下不显示发送（松手即发） */
  body.voiceMode.hasText #send { display:none; }
  body.voiceMode.hasText #pickMedia { display:flex; }

  /* 图片气泡 / 语音气泡 */
  .bubble.media { padding:4px; background:transparent !important; border:0 !important; }
  .bubble.media img { display:block; max-width:210px; max-height:280px;
                      border-radius:12px; object-fit:cover; }
  .row.agent .bubble.media { border-left:0 !important; }
  .vmsg { display:flex; align-items:center; gap:8px; min-width:90px; cursor:pointer; }
  .vmsg .bars { color:var(--accent); font-size:16px; }
  .vmsg .dur { font-size:12px; color:var(--muted); }
  .vsub { font-size:12px; color:var(--muted); margin-top:6px;
          border-top:1px dashed var(--line); padding-top:6px; }

  /* 大图查看 */
  .lightbox { position:fixed; inset:0; background:#000; display:none;
              align-items:center; justify-content:center; z-index:80; }
  .lightbox.on { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; object-fit:contain; }
  /* 没有传过头像的人点开放大 → 显示一个**大号的字** ✓，
     而不是"点了没反应" ✗（那会让人以为那段代码坏了 ✓）。 */
  .lightbox .bigletter { width:46vmin; height:46vmin; border-radius:50%;
                         background:var(--panel2); color:var(--muted);
                         display:flex; align-items:center; justify-content:center;
                         font-size:20vmin; font-weight:600; }
  .lightbox .bigletter[hidden] { display:none; }

  /* ── 左右滑 → 引用 ✓（2026-10-07 用户："左滑右滑可以引用，有那种动态感" ✓）──
     提示钉在**行原来那一边的边缘**上不动 ✓，行滑开就把那块地方**让出来** ✓
     —— "动态感"就是从这儿来的 ✓（东西是从底下被挪出来的 ✓，不是凭空冒出来 ✓）。
     ⚠️ 用 `left:0` / `right:0` + 反向 translate 把它**钉住** ✗：
        它是行的子节点 ✓ → 行一平移它也跟着走 ✓ → 不反向抵消就永远压在行底下 ✗
        （行是不透明的 ✓，等于看不见 ✓）。 */
  .row.swiping { position:relative; }
  .row.swiping .swhint { position:absolute; top:50%; left:0; transform:translateY(-50%);
                         display:flex; align-items:center; gap:4px;
                         color:var(--accent); font-size:13px; line-height:1;
                         white-space:nowrap; opacity:0; pointer-events:none; }
  /* 工坊那条也一样 ✓（`#wsMsgs` 里的行是 `.mkrow` ✓，不是 `.row` ✗）——
     左右滑引用是**两屏共有的手势** ✓，提示长得一样 ✓。 */
  #wsChat .mkrow.swiping { position:relative; }
  #wsChat .mkrow.swiping .swhint { position:absolute; top:50%; left:0;
                                   transform:translateY(-50%);
                                   display:flex; align-items:center; gap:4px;
                                   color:var(--accent); font-size:13px; line-height:1;
                                   white-space:nowrap; opacity:0; pointer-events:none; }

  /* 头像上**不许选字** ✓ —— 长按头像的活儿是"@ 他" ✓，
     让浏览器顺手把那个字选中了会显得很脏 ✓。 */
  .av { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

  /* ⚠️ **横向不许滚** ✗ —— 滑动时提示会顶出行的边缘一点点 ✓，
     不锁住的话列表会左右晃 ✓（那个比动画本身显眼得多 ✓）。 */
  #msgs { overflow-x:hidden; }

  /* @ 自动补全 */
  #atMenu { position:absolute; left:12px; right:12px; bottom:100%;
            margin-bottom:6px; background:var(--panel); border:1px solid var(--line);
            border-radius:12px; overflow:hidden; display:none; max-height:190px; overflow-y:auto;
            box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #atMenu.on { display:block; }
  #atMenu .pick { display:flex; align-items:center; gap:10px; padding:12px 14px;
                  border-bottom:1px solid var(--line); }
  #atMenu .pick:last-child { border-bottom:0; }
  #atMenu .pick .nm { flex:1; }
  #atMenu .pick .hint { font-size:12px; color:var(--muted); }
  #composer { position:relative; }

  /* ── 设置 ── */
  header.sub { background:var(--panel); border-bottom:1px solid var(--line);
               padding:calc(var(--inset-top) + 10px) 8px 10px; display:flex; align-items:center; }
  /* 和聊天页顶栏同样的做法：右侧放一个和返回键等宽的占位，
     标题才能真正居中（否则是在"剩余空间"里居中，视觉偏左）。 */
  header.sub .spacer { width:40px; flex-shrink:0; }
  header.sub h2 { margin:0; font-size:17px; font-weight:600; flex:1; text-align:center; }
  #settings .body { flex:1; min-height:0; overflow-y:auto;
                    padding-bottom:calc(30px + var(--inset-bottom)); }

  /* 设置页像抽屉一样从左侧滑入/滑出。
     打开时**让聊天页留在下面**，滑入过程中能看到它——否则滑到一半
     后面是空的，会显得很生硬。 */
  #settings { z-index:10; }
  @keyframes sheetIn  { from { transform:translateX(-100%); } to { transform:none; } }
  @keyframes sheetOut { from { transform:none; } to { transform:translateX(-100%); } }
  #settings.anim-in  { animation:sheetIn  .24s cubic-bezier(.22,1,.36,1); }
  #settings.anim-out { animation:sheetOut .18s cubic-bezier(.4,0,1,1) forwards; }

  /* ══════════════════════════════════════════════════════════════════
     管家设置的三屏（`.ascreen`：列表 / 改资料 / 编一档状态）。

     版式**照壳的「我的」** ✓ —— 通栏圆角分组 ✓、行间一条细线 ✓、
     `›` 22px `--muted` ✓。用户 2026-10-06 明确要求"一定要参考我的里的样式" ✓。

     ⚠️ **每个选择器都套了 `.ascreen`** ✗→✓ ——
        群聊页里已经有 `.row`（消息行 ✓）和 `.av`（气泡头像 ✓）了，
        而壳那边没有这两个名字 ✓，所以它敢直接叫 `.row` ✓。
        整块照搬会**串味** ✗（消息行会长到 50px 高 ✓）。
        加一层前缀 = **结构上**互不干扰 ✓，不是靠"记得别重名" ✓。
     ══════════════════════════════════════════════════════════════════ */
  .ascreen { z-index:20; }
  #agentEdit { z-index:21; }      /* 一层压一层 ✓：列表 < 改资料 ✓ */
  .ascreen.anim-in  { animation:sheetIn  .24s cubic-bezier(.22,1,.36,1); }
  .ascreen.anim-out { animation:sheetOut .18s cubic-bezier(.4,0,1,1) forwards; }

  /* ── 创意工坊（右上角那个入口）────────────────────────────────────────
     三屏：工坊（#workshop，**只罗列组件**）+ 组件页（#compView，压在上面）
     + 对话屏（#wsChat，从输入框的 ＋ 进 ✓）。
     ⚠️ z-index 要**比 .ascreen 的 20 高** ✗ —— 工坊是从群聊进的独立去处 ✓，
        和"管家"那三屏不是一层 ✓（但它进来的时候那三屏都是关着的 ✓，
        高了只是保险 ✓）。

     ★ 2026-10-07：**分区整个废掉了** ✗→✓（用户定的："不需要分实验区和
       使用区，右上角点击进入就只是单纯地罗列组件" ✓）。理由他自己给了 ✓：
       组件都在沙箱里、文件之间本来就隔离 ✓，分不分没有实际区别 ✓。
       于是这一屏只剩一件事：**列出来** ✓（「未固化」那套 2026-10-07 深夜也去掉了 ✓）。
       "做"和"改"都在别处（＋ 进的对话屏 / 组件页 ✓）。 */
  #workshop { z-index:22; }
  #compView { z-index:23; }
  #wsNav    { z-index:24; }
  #wsChat   { z-index:25; }
  /* ⚠️ **`#diySet` 原来没写 z-index** ✗→✓（2026-10-07 深夜，用户报的：
     「导航界面点击右上角没有显示 diy 助手的界面」✓）——
     它落在 `.ascreen` 的默认值（20）上 ✓，而它只可能从 `#wsNav`（24）进去 ✓ →
     **推上来了，但排在导航屏底下** ✓ —— 屏幕上什么都不变 ✓，
     看着像"点了没反应" ✓（最像坏掉的一种 ✓）。
     谁后推谁在上 ✓，它和 `#wsChat` 不会同时开 ✓，所以同档就行 ✓。 */
  #diySet   { z-index:25; }

  /* 「＋ 做一个新的」—— 全宽、最显眼 ✓（它是这一屏的主行动 ✓） */
  #workshop .wsnew { display:flex; align-items:center; justify-content:center; gap:9px;
                     width:100%; border:1px dashed #35507a; background:#0e1c30;
                     color:var(--accent); border-radius:14px; padding:15px;
                     font:inherit; font-size:16px; font-weight:600; }
  #workshop .wsnew:active { background:#16233a; }

  /* ★ 「组件容纳界面」= 一块**画布**（2026-10-07 晚上用户定的 ✓）——
     用户的原话：「整个组件容纳界面就像一张纸」✓，
     默认每个组件「上面是图标，下面是组件名称」✓（跟手机桌面上的应用一样 ✓），
     但**不只有这一种** ✓ —— 组件自己可以声明占几格、什么底色 ✓（`spot` ✓）。

     ⚠️ **格子是有固定高度的**（`grid-auto-rows` ✓）—— 不固定的话
        "占两格"就没有意义了 ✓（行高会跟着内容自己涨 ✓，"大一点"看不出来 ✓）。
     4 列：手机上每格约 78px 宽 ✓，放一个图标 + 两行字正好 ✓。 */
  #workshop .canvas { display:grid; grid-template-columns:repeat(4, 1fr);
                      grid-auto-rows:92px; gap:12px 10px; padding-top:6px; }
  #workshop .cell { display:flex; flex-direction:column; align-items:center;
                    justify-content:center; gap:7px; min-width:0;
                    border-radius:18px; background:var(--panel2);
                    border:1px solid transparent; padding:6px 4px;
                    transition:transform .12s ease; }
  #workshop .cell:active { transform:scale(.95); }
  #workshop .cell .ico { font-size:29px; line-height:1; }
  #workshop .cell .nm { font-size:12px; line-height:1.3; max-width:100%;
                        text-align:center; overflow:hidden;
                        display:-webkit-box; -webkit-line-clamp:2;
                        -webkit-box-orient:vertical; word-break:break-word; }
  /* ⚠️ 这里原来有一条「未固化」的小黄点 ✓ —— 2026-10-07 深夜跟着"固化"整套
     一起删了 ✓（用户定的：组件聊天没有所谓的固化和非固化概念了 ✓）。 */

  /* ── 调整模式（顶栏右上角那个按钮切的 ✓）────────────────────────────
     用户定的：「这个界面的右上角是一个整体功能，点击后可以推动组件进行调整」✓。
     ⚠️ 进了这个模式，**格子就不再是"点进去"的入口** ✓ ——
        手指在那个位置是"按住拖着走" ✓，两种手势在同一个位置会打架 ✓。 */
  /* ⚠️ `touch-action:none` **只在编辑态** ✓ —— 不写它的话，手指一动浏览器先拿去滚屏 ✓，
     拖拽根本收不到几个 move 事件 ✓（表现是"拖不动，页面在滚动"✓）。
     平时**绝对不能加** ✗：那一屏要能正常上下滚 ✓。 */
  #workshop.editing .cell { border:1.5px dashed #35507a; touch-action:none; }
  #workshop.editing .cell.drag { z-index:9; opacity:.92; transition:none;
                                 box-shadow:0 10px 26px rgba(0,0,0,.45); }
  #workshop.editing .cell.over { border-color:var(--accent); background:#16233a; }
  #workshop .edithint { color:var(--muted); font-size:12.5px; text-align:center;
                        padding:0 2px 10px; }
  /* 「这个群还没有组件」那一句 ✓（只有容纳界面用得到 ✓ ——
     导航屏永远有「新建组件」那一行 ✓，不会空 ✓）。 */
  #workshop .wsempty { color:var(--muted); text-align:center;
                       padding:26px 18px; line-height:1.9; font-size:14px; }

  /* ── 组件页：**纯预览**（2026-10-07 晚上改的）─────────────────────────
     ★ 用户定的：这一屏「不要有任何的提示和设置选项」✓，
       也**没有**保留/继续改/删除那几个按钮了 ✓（"界面就被压缩了"✓）——
       那些全搬去了创意工坊的组件管理页 ✓。
       只留**顶栏右上角一个图标** ✓，指向它在工坊里那条对话 ✓。 */
  #compView .cpwrap { flex:1; min-height:0; margin:0 14px;
                      border:1px solid var(--line); border-radius:14px;
                      overflow:hidden; background:var(--bg); }
  #compView iframe { width:100%; height:100%; border:0; display:block; }
  /* 底下垫一点，免得预览框贴着屏底（没有按钮那一栏了 ✓，只能靠它 ✓） */
  #compView .cpwrap { margin-bottom:calc(var(--inset-bottom) + 12px); }

  /* ── 对话屏（工坊里的那段对话）───────────────────────────────────────
     和群聊那屏**不是一套东西** ✓：这里是**你一个人对着它** ✓，
     所以没有"该不该接话"那些东西 ✓ —— 只有消息、状态、输入框 ✓。

     ★ 2026-10-07：入口从**群聊右上角**挪到了**输入框的 ＋** ✓（和 相册/拍摄 并列 ✓），
       所以它现在是**从群聊直接进**的一屏 ✓（右上角那个还在 ✓，但那个只列组件 ✓）。
       顶栏多两样：**切换对话**（≡ ✓）和 **⋯**（保留/删除 ✓）。 */
  #wsChat .mkbody { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
                    padding:14px; display:flex; flex-direction:column; gap:10px; }
  /* ★ 气泡旁边**带头像**（2026-10-07 深夜 ✓）—— 用户定的：
     「组件聊天界面也需要有用户区别」✓。左边是小助手、右边是你 ✓
     （和群聊那套一个朝向 ✓，不用重新学 ✓）。
     ⚠️ 名字**只写在小助手那边** ✓ —— 你的名字你自己知道 ✓，
        而它叫什么**是能改的** ✓（改了要立刻看得见 ✓）。 */
  #wsChat .mkrow { display:flex; gap:8px; max-width:90%; align-items:flex-start; }
  #wsChat .mkrow.mine { align-self:flex-end; flex-direction:row-reverse; }
  #wsChat .mkrow .av { width:34px; height:34px; flex:0 0 34px; border-radius:10px;
                       background:var(--panel2); color:var(--muted);
                       display:flex; align-items:center; justify-content:center;
                       font-size:14px; background-size:cover; background-position:center; }
  #wsChat .mkrow .wrap2 { min-width:0; }
  #wsChat .mkrow .who { font-size:11.5px; color:var(--muted); margin:0 3px 3px; }
  #wsChat .mkbub { background:var(--panel); border-radius:14px; padding:9px 13px;
                   white-space:pre-wrap; word-break:break-word; font-size:15px; }
  #wsChat .mkrow.mine .mkbub { background:var(--accent-bg); }
  #wsChat .mkrow.agent .mkbub { background:var(--panel2); }
  /* 「问题 2/3」那个小标签 —— 让他一眼看见"还有几个" ✓（用户点名的可视化 ✓） */
  #wsChat .qchip { display:inline-block; margin-right:7px; padding:1px 8px;
                   border-radius:999px; font-size:12px; font-weight:600;
                   color:var(--accent); border:1px solid #35507a; background:#0e1c30; }
  #wsChat .mkbub b { color:#fff; font-weight:600; }
  #wsChat .mkbub code { font-family:ui-monospace,Menlo,Consolas,monospace;
                        font-size:13.5px; background:#0e1116; border:1px solid var(--line);
                        border-radius:5px; padding:0 4px; }
  /* 列表项前面那个小圆点（正文里的 `- …`） */
  #wsChat .mli::before { content:'·'; color:var(--muted); margin-right:7px; font-weight:700; }
  /* 开场那句提示：淡淡的一行，不是消息 */
  #wsChat .mknote { color:var(--muted); font-size:13.5px; line-height:1.8;
                    background:var(--panel); border:1px solid var(--line);
                    border-radius:12px; padding:12px 14px; }
  /* 状态条 —— App 管家那边同一套（转圈 + 一句话）✓ —— 用户点名的"交互性"就在这儿：
     "它现在在干什么"必须看得见 ✓，尤其是**子代理在写**那一段（那是最长的一段）✓。 */
  #wsChat .mkst { flex:0 0 auto; display:flex; align-items:center; gap:9px;
                  padding:0 16px 8px; font-size:13.5px; color:var(--muted); line-height:1.5; }
  #wsChat .mkst[hidden] { display:none; }
  #wsChat .mkst i { width:14px; height:14px; flex:0 0 14px; border-radius:50%;
                    border:2px solid var(--line); border-top-color:var(--accent);
                    animation:spin .8s linear infinite; }
  #wsChat .mkfoot { flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;
                    padding:10px 12px calc(10px + var(--inset-bottom));
                    border-top:1px solid var(--line); background:var(--panel); }
  #wsChat textarea { flex:1; min-width:0; padding:10px 13px; background:var(--panel2);
                     border:1px solid var(--line); border-radius:16px; color:var(--text);
                     font:inherit; font-size:16px; resize:none; max-height:120px; line-height:1.4; }
  #wsChat textarea:focus { outline:none; border-color:var(--accent); }
  #wsChat .mksend { width:44px; height:44px; flex:0 0 auto; display:none;
                    align-items:center; justify-content:center; color:var(--accent); }
  /* ★ **右边那个按钮：有字就是发送、没字就是加图** ✗→✓（用户定的 ✓）——
     两个都在 DOM 里 ✓，`syncWsSend` 按"输入框里有没有字"决定显示哪个 ✓
     （和生活管家的 ＋ / 发送同一套做法 ✓）。 */
  #wsChat .mkpick { width:44px; height:44px; flex:0 0 auto; display:flex;
                    align-items:center; justify-content:center; color:var(--muted); }
  /* 待发的那张图 —— 缩略图 + 一个 ✕ ✓（和生活管家的待发区一个意思 ✓） */
  #wsChat .mkpend { flex:0 0 auto; display:flex; gap:8px; padding:8px 12px 0; }
  #wsChat .mkpend[hidden] { display:none; }
  #wsChat .mkpend .pv { position:relative; width:62px; height:62px; border-radius:10px;
                        overflow:hidden; border:1px solid var(--line);
                        background:var(--panel2); }
  #wsChat .mkpend .pv img { width:100%; height:100%; object-fit:cover; display:block; }
  #wsChat .mkpend .rm { position:absolute; top:-1px; right:-1px; width:20px; height:20px;
                        border-radius:0 10px 0 10px; background:rgba(0,0,0,.62);
                        color:#fff; font-size:12px; line-height:20px; text-align:center; }
  /* 气泡里的图 ✓ —— 和小管家那边同一套尺寸规矩（max-width 别撑破气泡 ✓） */
  #wsChat .mkbub.media { padding:6px; }
  #wsChat .mkbub.media img { max-width:100%; border-radius:10px; display:block; }
  #wsChat .mkbub .cap { white-space:pre-wrap; padding:7px 7px 3px; }

  /* ── 导航屏（工坊的门口）─────────────────────────────────────────────
     ★ 2026-10-07 晚上用户定的形状 ✗→✓：＋ 进来**先是这一屏** ✓ ——
       「导航界面就是比较规整了，**按照顺序**展示了所有组件聊天的入口，
         点击后就是组件聊天界面，然后还有个新建组件」✓。
     ⚠️ **是"规整的列表"，不是"图标网格"** ✗→✓ —— 我上一版做成了网格 ✓，
        用户这一版说的是按顺序排 ✓。和右上角那个"容纳界面"**刻意不一样** ✓：
        那个是给人看的（爱怎么摆怎么摆 ✓），这个是给人**用**的 ✓
        （顺序稳定、一眼找到、名字看得全 ✓）。 */
  #wsNav .navlist { display:flex; flex-direction:column; gap:2px; }
  #wsNav .navrow { display:flex; align-items:center; gap:12px; width:100%;
                   background:none; border:0; border-radius:12px;
                   padding:13px 10px; color:var(--text); font:inherit;
                   font-size:16px; text-align:left; }
  #wsNav .navrow:active { background:var(--panel2); }
  #wsNav .navrow .ico { width:38px; height:38px; flex:0 0 38px; border-radius:11px;
                        background:var(--panel2); display:flex; align-items:center;
                        justify-content:center; font-size:20px; line-height:1; }
  #wsNav .navrow .col { flex:1; min-width:0; }
  #wsNav .navrow .nm { display:block; overflow:hidden; text-overflow:ellipsis;
                       white-space:nowrap; }
  #wsNav .navrow .sub { display:block; font-size:11.5px; margin-top:2px;
                        color:var(--warn2,#d8b06a); }
  #wsNav .navrow .chev { color:var(--muted); font-size:22px; line-height:1; }
  /* ★ 参与过这个组件的人的头像（2026-10-07 深夜 ✓）—— 用户定的：
     「对于每个组件，需要标注其由群里哪些用户参与构建，在导航界面，
      每个组件的右侧标注头像」✓。
     ⚠️ 叠着排（后一个压前一个的边 ✓）而不是并排铺开 ✓ ——
        人一多（比如四个人都参与过 ✓）铺开会把名字挤没 ✓。 */
  /* ⚠️ `flex:0 0 auto` = **别被挤** ✓ —— 名字再长，头像和 `›` 也保持原样 ✓
     （名字那一格是 `flex:1` ✓，它先让 ✓）。 */
  #wsNav .navrow .avs { display:flex; flex:0 0 auto; padding-right:6px; }
  /* 还没做出组件的那种：**同一个图标、淡一点** ✓（见 `navRow` 那段 ✓）。 */
  #wsNav .navrow .ico.off { opacity:.45; }
  #wsNav .navrow .avs .av { width:26px; height:26px; border-radius:8px;
                            background:var(--panel2); color:var(--muted);
                            display:flex; align-items:center; justify-content:center;
                            font-size:11.5px; border:2px solid var(--bg);
                            background-size:cover; background-position:center; }
  #wsNav .navrow .avs .av + .av { margin-left:-9px; }
  /* diy 小助手在导航右上角那个头像 ✓ */
  #wsNav .icon-btn .diyav { width:30px; height:30px; border-radius:50%;
                            background:var(--panel2); color:var(--muted);
                            display:flex; align-items:center; justify-content:center;
                            font-size:13px; background-size:cover;
                            background-position:center; }
  /* 「新建组件」那一行**跟别的不一样** ✓ —— 虚线框、加号、强调色 ✓。
     它是这一屏唯一"不是东西"的入口 ✓，长得一样就找不着了 ✓。 */
  #wsNav .navrow.new { border:1.5px dashed #35507a; color:var(--accent); }
  #wsNav .navrow.new .ico { background:none; border:1.5px dashed #35507a;
                            color:var(--accent); font-size:22px; }
  #wsNav .navlist .navrow.new { margin-bottom:10px; }

  /* 组件管理屏的标题：就是那个组件的名字 ✓。
     ⚠️ 里面是**两个**元素 ✓，所以要自己摆平 —— `header.sub h2` 只管
        "占满中间并居中" ✓，不负责里面怎么排 ✓。名字长短不一，**必须能缩** ✓
        （群里做过的组件名可能是七八个字 ✓，撑不下就把右边的 ⋯ 顶出去 ✓）。 */
  #wsChat .sub h2 { display:flex; align-items:center; justify-content:center;
                    gap:7px; min-width:0; }
  #wsChat .sub h2 .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* ⚠️ 这里原来有一条「未固化」的小牌子样式 ✓ —— 2026-10-07 深夜跟着"固化"
     整套一起删了 ✓（用户定的：组件聊天没有所谓的固化和非固化概念了 ✓）。 */
  .ascreen .abody { flex:1; overflow-y:auto; overscroll-behavior:contain;
                    padding:calc(var(--inset-top) + 14px) 14px calc(var(--inset-bottom) + 24px); }

  .ascreen .sec { color:var(--muted); font-size:13px; padding:16px 4px 6px; }
  .ascreen .grp { background:var(--panel); border-radius:14px; overflow:hidden;
                  margin-bottom:8px; }
  .ascreen .row { display:flex; align-items:center; gap:10px; width:100%; margin:0;
                  /* ⚠️ **`max-width:none` 是必须的** ✗→✓ —— 2026-10-06 用户截图：
                     三行右边没对齐、「点击编辑」悬在半空 ✓，**灰细线也短一截** ✓。
                     两个症状是**同一个原因** ✓：群聊页里本来就有一条
                       `.row { display:flex; gap:8px; max-width:84%; }`   ← 消息气泡行 ✓
                     我写了 `.ascreen .row` ✓ 但只盖住**我写出来的**那几条属性 ✗，
                     `max-width:84%` 照样生效 ✓ → 行只有 84% 宽 ✓
                     → 后缀靠不了右 ✓，而**那条 border-top 的长度就是行宽** ✓ → 线也短 ✓。
                     **"加了作用域前缀"不等于隔离干净** ✓ —— 挡不住你没写的 ✓。 */
                  max-width:none;
                  min-height:50px; padding:0 16px; background:none; border:0;
                  border-radius:12px; color:var(--text); font:inherit; text-align:left; }
  .ascreen .row + .row { border-top:1px solid var(--line); }
  .ascreen .row:active { background:#1d2129; }
  .ascreen .row .rl { flex:1; min-width:0; font-size:16px; line-height:1.3; }
  .ascreen .row .rv { color:var(--muted); font-size:16px; line-height:1.3;
                      max-width:52%; overflow:hidden; text-overflow:ellipsis;
                      white-space:nowrap; }
  .ascreen .row .go { color:var(--muted); font-size:22px; line-height:1; padding-left:2px; }
  /* 右边那句「点击编辑」：**是个动作** ✓，所以用强调色 ✓
     （和「＋ 新建或加入空间」同一个道理 ✓）。 */
  .ascreen .row .act { color:var(--accent); font-size:15px; }
  .ascreen .row.plain:active { background:var(--panel); }   /* 不能点的行别给反馈 ✗ */

  /* 资料块（点它 = 进"改管家资料"那一屏 ✓） */
  .ascreen .prof { background:var(--panel); border-radius:14px; display:flex;
                   align-items:center; gap:14px; padding:18px 16px 16px;
                   margin-bottom:8px; }
  .ascreen .prof:active { background:#1d2129; }
  .ascreen .prof .av { width:58px; height:58px; border-radius:10px; overflow:hidden;
                       flex:none; background:#232833; color:var(--muted);
                       font-size:24px; display:flex; align-items:center;
                       justify-content:center; background-size:cover;
                       background-position:center; }
  .ascreen .prof .who { min-width:0; }
  .ascreen .prof .who .n { font-size:19px; font-weight:600; line-height:1.25; }
  .ascreen .prof .go { color:var(--muted); font-size:22px; line-height:1; margin-left:auto; }

  /* ── 改资料那一屏：**照抄壳的「我的」进头像** ✓ ────────────────
     那几条（`.avcard` / `.bigav` / `.tip` 的数值）是 2026-10-06
     用户量着截图来回调出来的 ✓，别再自己发明 ✗。 */
  .ascreen .card { background:var(--panel); border:1px solid var(--line);
                   border-radius:16px; padding:18px; margin-bottom:12px; }
  .ascreen .card.avcard { padding:30px 18px !important; }   /* 上下同一个值 ✓ */
  .ascreen label { display:block; color:var(--muted); font-size:12.5px; margin:12px 0 6px; }
  .ascreen .bigav { display:flex; justify-content:center; align-items:center;
                    width:100%; margin:0 auto; padding:0; }
  .ascreen .bigav .av { width:150px; height:150px; font-size:56px; cursor:pointer;
                        overflow:hidden; display:flex; align-items:center;
                        justify-content:center; border-radius:50%;
                        background:#232833; color:var(--muted);
                        background-size:cover; background-position:center; }
  .ascreen .bigav .av img { width:100%; height:100%; object-fit:cover; display:block; }
  /* 提示语：**在"头像下沿"和"卡片下沿"之间居中** ✓ —— margin-top 要等于卡片的下内边距 ✓ */
  .ascreen .tip { color:var(--muted); font-size:12.5px; text-align:center; margin-top:30px; }
  .ascreen .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  .ascreen .swap { margin-top:14px; text-align:center; color:var(--muted); font-size:13px; }
  .ascreen .swap b { color:var(--accent); font-weight:600; }
  .ascreen .btn-save { display:block; width:100%; padding:14px; background:var(--accent);
                       color:var(--on-accent); font-weight:600; font-size:16px;
                       border-radius:12px; }
  .ascreen .btn-save:disabled { opacity:.45; }

  /* ── 编一档状态：**底部弹层 + 三块板** ✓ ────────────────────────────
     用户 2026-10-06 第二次提的：从整屏**改回下方的半屏** ✓
     （"其实可以按照之前的从下方弹出半屏" ✓），并且**板块化** ✓
     （"板块化会美观些" ✓）。

        待机显示   = 板①开关 + 板②状态区/添加 + 板③轮换间隔
        思考中     =          板②
        保持沉默   = 板①开关 + 板②

     `.sblk` 用 `--panel2` ✓ —— 弹层本身是 `--panel` ✓，
     两块同色就"没有层次" ✗，深浅差一档才看得出是**分开的两块** ✓。
     `.sheet .panel` 自带 18px 内边距 ✓ → 板子天然内缩 ✓。 */
  .sblk { background:var(--panel2); border-radius:14px; overflow:hidden;
          margin-bottom:10px; }
  .sblk .hrow { display:flex; align-items:center; gap:12px;
                padding:14px 16px; min-height:52px; }
  .sblk .hrow .t { flex:1; font-size:16px; }
  /* 区域 = **刚好三行** ✓（用户 2026-10-06："可以刚好展示完整三条" ✓）。
     ⚠️ 行高要**写死**，不能用 `min-height` 猜 ✗ ——
        上一版写的就是 `min-height:52px` ✓，而里面那个输入框
        （padding 11 + 15px 的字 ✓）实际把行撑到了 ~55px ✗
        → 3 行要 165 ✓，而区域只有 156 ✗ → **第三条被切掉一半** ✓。
        `box-sizing:border-box` 让分隔线那 1px 也算在 56 里 ✓，
        所以三行正好 168 ✓，一个像素不多不少 ✓。 */
  .slist2 { max-height:168px; overflow-y:auto; }
  .srow2 { display:flex; align-items:center; gap:8px; padding:0 12px;
           height:56px; box-sizing:border-box; }
  .srow2 + .srow2 { border-top:1px solid var(--line); }
  /* ⚠️ 输入框用 `--panel` ✓（**比板子浅一档** ✓）—— 和板子同色就"看不出是个框" ✗ */
  .srow2 input { flex:1; min-width:0; background:var(--panel); border:0;
                 border-radius:9px; padding:11px 12px; color:var(--text);
                 font:inherit; font-size:15px; }
  .srow2 input:focus { outline:none; box-shadow:0 0 0 1px var(--accent); }
  .srow2 .del { color:var(--muted); font-size:19px; line-height:1; padding:6px 8px; }
  .srow2 .del:active { color:var(--danger); }
  /* 「＋ 添加一条」：**居中蓝字** ✓ —— 它是个动作，不是一行数据 ✓
     它在**板②里面** ✓（用户："第二个板块是两部分，一个是最多显示三条……的区域，
     另一个是添加一条" ✓）—— 所以上面隔一条细线 ✓ 而不是单独一块 ✗。 */
  .sblk .addline2 { display:block; width:100%; text-align:center; color:var(--accent);
                    font-size:16px; padding:15px 0; border-top:1px solid var(--line); }
  /* 轮换间隔：**就地一个输入框** ✓ —— 用户 2026-10-06：
     "编辑方式就是一个一个输入框，右边单位，点击直接编辑输入框，不用额外的界面" ✓。
     （原来是点一下弹 `promptText` ✓ —— 为一个数字跳一趟界面太重 ✓。） */
  .sblk .intvrow { display:flex; align-items:center; gap:10px; width:100%;
                   padding:14px 16px; min-height:52px; text-align:left; }
  .sblk .intvrow .t { flex:1; font-size:16px; }
  .sblk .intvrow input { width:66px; text-align:center; background:var(--panel);
                         border:0; border-radius:9px; padding:10px 6px;
                         color:var(--text); font:inherit; font-size:16px; }
  .sblk .intvrow input:focus { outline:none; box-shadow:0 0 0 1px var(--accent); }
  .sblk .intvrow .u { color:var(--muted); font-size:16px; }

  /* ── 性格：**直奔一个文本框** ✓（用户："不要给管家的话，直接一个文本框" ✓）
     平时只露**前两行** ✓，点开才展开编辑 ✓。 */
  .ascreen .pbox { padding:14px 16px; font-size:15px; line-height:1.5;
                   color:var(--text); white-space:pre-wrap; word-break:break-word;
                   display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                   overflow:hidden; min-height:22px; }
  .ascreen .pbox.empty { color:var(--muted); }
  .ascreen .pwrap { display:flex; flex-direction:column; }
  .ascreen .ptext { width:100%; min-height:150px; background:var(--panel2); border:0;
                    border-radius:12px; padding:13px 14px; color:var(--text);
                    font:inherit; font-size:15px; line-height:1.5; resize:vertical; }
  .ascreen .ptext:focus { outline:none; box-shadow:0 0 0 1px var(--accent); }
  .ascreen .pfoot { display:flex; align-items:center; gap:12px; padding:10px 16px 14px; }
  .ascreen .pfoot .cnt { flex:1; color:var(--muted); font-size:12.5px; }
  .ascreen .pfoot button { color:var(--accent); font-size:15px; font-weight:600; }

  .item { display:flex; align-items:center; padding:16px 20px; background:var(--panel);
          border-bottom:1px solid var(--line); gap:12px; }
  .item .k { flex:1; }
  .item .v { color:var(--muted); font-size:14px; max-width:55%; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  /* `›` —— **大一档** ✓（用户 2026-10-06："有点小，不太美观"）。
     ⚠️ 颜色从 `--line` 改成 `--muted` ✗→✓：
        `--line` 是**描边色**（`#262b36`）✓，拿它画箭头本来就偏暗 ✗
        —— 这也正是"不太美观"的一半原因 ✓。
        `--muted` 是次级文字色 ✓，和外面那一列"值"同色 ✓，是这类箭头的常规画法 ✓。
     `line-height:1` 是必须的 ✓：不然 22px 的行高会把行撑高 ✓
     （这行是 `padding:16px 20px` 撑的 ✓，不该被字撑 ✓）。 */
  .item .chev { color:var(--muted); font-size:22px; line-height:1; }

  /* 退出登录：**居中、红字、没有箭头** —— 和「我的」那一页保持一致 ✓。
     它不是一个"条目"（没有值、没有去处），是一个动作 ✓；
     跟在一列同样排版的条目后面，会看着像"还能点进去看点什么" ✗。 */
  .item[data-act="logout"] { justify-content:center; }
  .item[data-act="logout"] .k { flex:0 0 auto; }
  .danger { color:var(--danger) !important; }
  .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { padding:7px 14px; font-size:13px; color:var(--muted); background:var(--panel2); }
  .seg button.on { background:var(--accent); color:var(--on-accent); font-weight:600; }

  /* ── 弹层 ── */
  .sheet { position:fixed; top:0; right:0; left:0; bottom:calc(var(--inset-bottom) + var(--kb)); background:rgba(0,0,0,.6); display:none;
           align-items:flex-end; z-index:50; }
  .sheet.on { display:flex; }
  .sheet .panel { width:100%; background:var(--panel); border-radius:18px 18px 0 0;
                  padding:18px 18px; max-height:100%; overflow-y:auto; }
  .sheet h3 { margin:0 0 14px; font-size:16px; }

  /* 工坊那个 ⋯ 菜单 —— 它住在 `.sheet .panel` 里 ✓，
     ⚠️ **不能借 `.ascreen .row` 那套** ✗（那一套是按 `.ascreen` 限定的 ✓，
        弹层不是 `.ascreen` ✓）—— 借了就是"点了没样式、像一行光字" ✓。 */
  /* ⚠️ **居中** ✓（用户 2026-10-07 深夜看着截图定的 ✓）——
     原来靠左 ✓，他说要居中 ✓。底下那个「取消」本来就是居中的 ✓，
     于是这一列从上到下就齐了 ✓。 */
  .wsmenu { display:flex; flex-direction:column; }
  .wsmenu button { width:100%; text-align:center; background:none; border:0;
                   border-bottom:1px solid var(--line); padding:15px 4px;
                   color:var(--text); font:inherit; font-size:15.5px; }
  .wsmenu button:last-child { border-bottom:0; }
  .wsmenu button:active { background:var(--panel2); }
  /* 重命名那个输入框 —— 和群聊输入框同一套观感 ✓（16px 是**防 iOS 聚焦缩放**的 ✓） */
  .rninput { width:100%; box-sizing:border-box; padding:12px 14px; margin-bottom:4px;
             background:var(--panel2); border:1px solid var(--line); border-radius:12px;
             color:var(--text); font:inherit; font-size:16px; }
  .rninput:focus { outline:none; border-color:var(--accent); }
  .rnhint { color:var(--muted); font-size:13px; line-height:1.7; margin:-6px 0 12px; }

  /* ── 一个居中的确认框 ✓ ──────────────────────────────────────────────
     ⚠️ **不用弹层那套** ✗（`.sheet` 是从底下升上来的 ✓，那是"选点什么"的姿势 ✓）：
        确认是**打断**——它在问"你确定吗"✓，居中、盖住、两句话 ✓。
     ⚠️ z-index 比弹层（50）高 ✓ —— 它是**在弹层上面**弹出来的 ✓
        （点"删除"时弹层还没关干净 ✓）。 */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:60;
           display:none; align-items:center; justify-content:center; padding:34px; }
  .modal.on { display:flex; }
  .modal .box { width:100%; max-width:320px; background:var(--panel);
                border:1px solid var(--line); border-radius:16px;
                padding:20px 18px 14px; }
  .modal .box h4 { margin:0 0 9px; font-size:16.5px; font-weight:600; }
  .modal .box p { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.75; }
  .modal .box .acts { display:flex; gap:10px; }
  .modal .box .acts button { flex:1; padding:12px; border-radius:12px;
                             font:inherit; font-size:15px; font-weight:600; }

  /* ⚠️ diy 小助手的设置屏**没有自己的样式** ✓ —— 它整屏照抄
     改管家资料那一屏（`.card.avcard` / `.bigav` / `.tip` / `.field` /
     `.btn-save` / `.swap` ✓，都在 `.ascreen` 底下 ✓）。
     ⚠️ **别在这儿另发明一套** ✗ —— 两屏一旦各有一套，改一边的间距
        另一边不跟 ✓，而那是用户**看得见**的不一致 ✓。（原来那几条
        `.diyhead` / `.diyav2` / `.diychange` 就是这么删掉的 ✓。） */

  /* 「+」面板：微信那种横向网格 —— 圆角方块图标 + 下方小字 */
  .plus-grid { display:flex; gap:16px; flex-wrap:wrap; }
  .plus-item { display:flex; flex-direction:column; align-items:center; gap:8px;
               width:68px; background:none; padding:0; }
  .plus-item .ico { width:58px; height:58px; border-radius:16px; background:var(--panel2);
                    display:flex; align-items:center; justify-content:center;
                    color:var(--text); }
  .plus-item .lbl { font-size:12px; color:var(--muted); }
  .sheet .actions { display:flex; gap:10px; margin-top:16px; }
  .sheet .actions button { flex:1; padding:13px; border-radius:12px; font-weight:600; }
  .btn-ghost { background:var(--panel2); color:var(--text); }
  .btn-solid { background:var(--accent); color:var(--on-accent); }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
           background:var(--panel2); border:1px solid var(--line); color:var(--text);
           padding:10px 18px; border-radius:10px; font-size:14px; z-index:99;
           opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }

  /* 开机占位。**为什么要它**：以前登录页是静态 HTML 里"默认显示"的那一屏，
     而"到底登录了没"要打一次 /auth/me 才知道——那几百毫秒里，**明明是已登录的
     用户也会看到登录页一闪而过** ✗ 很影响体验。
     现在开局什么都不显示，只有一个转圈；**确认完状态再决定进哪一屏**。 */
  #boot { position:fixed; inset:0; display:grid; place-items:center;
          background:var(--bg); z-index:200; }
  #boot[hidden] { display:none; }
  #boot i { width:26px; height:26px; border-radius:50%;
            border:2.5px solid var(--line); border-top-color:var(--accent);
            animation:bootspin .8s linear infinite; }
  @keyframes bootspin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- 开机占位：确认登录状态之前只显示它（见样式里那段说明） -->
<div id="boot" hidden><i></i></div>

<!-- 登录 -->
<div class="screen" id="login">
  <div class="wrap">
    <div class="logo">管</div>
    <h1>生活管家</h1>
    <p class="sub">和你的管家，还有重要的人</p>
    <div class="err" id="loginErr"></div>
    <input class="field" id="u" placeholder="用户名" autocomplete="username">
    <input class="field" id="p" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn-primary" id="doLogin">登录</button>
  </div>
</div>

<!-- 聊天 -->
<div class="screen" id="chat">
  <header class="top">
    <!-- ⚠️ **原来带一个 `margin-left:-8px`** ✗ —— 2026-10-06 用户指出的：
         "群昵称和管家状态…似乎不算完全居中" ✓。
         它把整个顶栏往左顶了 8px ✓，右边那个占位却还是 40px ✓，
         于是中间那块**向左偏了 4px** ✓ —— 肉眼看得出来 ✓。
         删掉 ✓：现在左 ☰ 40px、右占位 40px、两边内边距都是 16px ✓，
         **居中由结构保证** ✓，不是靠"记得两边对称地写" ✓。
         （颜色也补上 `plain` ✓ —— 和「<」那个返回箭头同一个 `--text` ✓，
           原来用的是 `.icon-btn` 默认的 `--muted` ✓，淡一档 ✓。） -->
    <!-- ☰ 用 **SVG** 而不是文字字符 ✗→✓ —— 2026-10-06：
         文字字形的"墨迹"离盒子边多远是**字体决定的** ✓，
         我没法算准 ✓，也就没法跟别的图标对齐 ✓。
         SVG 的位置是**算得出来**的 ✓（下面那条 `translateX` 就是这么来的 ✓）。 -->
    <div class="icon-btn plain" id="openSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6h12M6 12h12M6 18h12" />
      </svg>
    </div>
    <div class="info">
      <div class="gname" id="gname">—</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
    </div>
    <!-- ★ 右上角：**创意工坊** ✓ —— 2026-10-07。这个位置 10-06 特地留白过 ✓，
         现在给它 ✓。它顶掉了原来那个 `.spacer` ✓ —— 占位本来就是
         "放一个和左边等宽的东西、让群名真居中"用的 ✓，
         现在右边真有一个 40px 的按钮 ✓，占位就是多余的 ✗。
         ⚠️ 图标是 SVG（和 ☰ / ↻ 同一套画法 ✓）而不是文字或 emoji ✗ ——
            字形的墨迹位置算不准 ✓，就没法跟另外两个对齐 ✓。 -->
    <div class="icon-btn plain" id="openWorkshop" aria-label="创意工坊">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="5" height="5" rx="1.4" />
        <rect x="13" y="6" width="5" height="5" rx="1.4" />
        <rect x="6" y="13" width="5" height="5" rx="1.4" />
        <rect x="13" y="13" width="5" height="5" rx="1.4" />
      </svg>
    </div>
  </header>
  <div id="msgs"></div>
  <div id="composer">
    <div id="atMenu"></div>
    <!-- 引用条：长按气泡选了「引用」之后出现在这里，发完自动消失。
         微信也是这个样子——引用是**输入状态**的一部分，不是消息的一部分。 -->
    <!-- 待发附件：`+` 里选的图和文件先停在这儿 ✓，发出去之前一直留着 ✓ -->
    <div id="pendbar" hidden></div>

    <div id="qbar" hidden>
      <div class="qbody">
        <div class="qwho" id="qwho"></div>
        <div class="qtext" id="qtext"></div>
      </div>
      <button class="qx" id="qclose" aria-label="取消引用">✕</button>
    </div>
    <div id="composerRow">
      <!-- 语音/键盘切换：**图标要跟着模式变**（微信就是这样的）
           键盘模式显示"麦克风"（点了切语音），语音模式显示"键盘"（点了切回来）。
           两个 SVG 都在，靠 body.voiceMode 决定显示哪个。 -->
      <button class="icon-btn" id="modeToggle" aria-label="切换语音/键盘">
        <svg class="ico-mic" viewBox="0 0 24 24" width="26" height="26" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
          <path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3"/>
        </svg>
        <svg class="ico-kbd" viewBox="0 0 24 24" width="26" height="26" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6" width="19" height="12" rx="2.5"/>
          <path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 14h12"/>
        </svg>
      </button>

      <!-- 不放 placeholder：微信的输入框就是空的，提示文字反而占地方 -->
      <textarea id="text" rows="1"></textarea>
      <button id="holdTalk">按住 说话</button>

      <!-- 表情包入口：位置先留着，内容后面内置。
           微信的排版是 [语音] [输入] [表情] [+] ——按这个顺序排。 -->
      <button class="icon-btn" id="pickSticker" aria-label="表情">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
          <circle cx="9" cy="9.5" r=".6" fill="currentColor"/>
          <circle cx="15" cy="9.5" r=".6" fill="currentColor"/>
        </svg>
      </button>

      <button class="icon-btn" id="pickMedia" aria-label="更多">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
        </svg>
      </button>
      <button id="send" aria-label="发送">
        <!-- 纸飞机：**线条型、机头朝右** ✓ —— 2026-10-06 用户："也是线条型的 svg，
             然后左右方向" ✓（由"朝上"改成"横向朝右" ✓ —— 那才是"发送"的常规方向 ✓）。
             形状就是刚才那个三角帆**顺时针转了 90°** ✓
             （同一个造型 ✓，只是躺下来了 ✓）：
               机头 (21.4,12) · 后上角 (3.6,3) · 尾槽 (8.4,12) · 后下角 (3.6,21) ✓
             走描边、不填充 ✓ —— 和这一行里别的图标**同一种画法** ✓
             （`stroke-width` 也用同一个 1.8 ✓，粗细才一致 ✓）。 -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.4 12 3.6 21 8.4 12 3.6 3z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 隐藏的文件输入：拍照 / 相册分开两个，
       capture="environment" 才会直接唤起后置相机而不是相册 -->
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileGallery" accept="image/*" hidden>
  <input type="file" id="fileAvatar" accept="image/*" hidden>

  <!-- 图片大图查看 -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" alt="">
    <div class="bigletter" id="lightboxTxt" hidden></div>
  </div>
</div>

<!-- 管家设置：**三屏** ✓（列表 / 改资料 / 编一档状态），见 #settings 那套 -->
<!-- ⚠️ 都不放返回箭头 ✓ —— 用户定的："也是不要<，然后手势可返回" ✓ -->
<!-- ⚠️ 报给原生的屏名一律是 'settings' ✓（见 __goBack / openAgentSettings 的注释 ✓） -->
<div class="screen ascreen" id="agent"><div class="abody" id="agentBody"></div></div>
<div class="screen ascreen" id="agentEdit"><div class="abody" id="agentEditBody"></div></div>

<!-- ★ 创意工坊（2026-10-07）—— 群聊右上角那个入口进的就是这一屏。
     它展示**这个群自己**的组件（服务端按 group_id 分目录 ✓），
     空的时候就是"尚未创建组件" ✓。
     ⚠️ 报给原生的屏名走 pushScreen ✓，这里不用管 ✓。 -->
<div class="screen ascreen" id="workshop">
  <header class="sub">
    <button class="icon-btn back" id="backWorkshop" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>创意工坊</h2>
    <!-- ★ 「整体功能」——用户定的：「这个界面的右上角是一个整体功能，
         点击后可以推动组件进行调整」✓。点一下进调整模式，再点一下收工+存位置 ✓。
         ⚠️ 它**顶掉的是 `.spacer`** ✓ —— 那个 40px 的占位本来就是为了标题居中 ✓，
            这个图标正好同样宽 ✓，居中不受影响 ✓。 -->
    <button class="icon-btn" id="wsArrange" aria-label="调整组件位置">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5v17M3.5 12h17"/>
        <path d="M12 3.5 9.6 6M12 3.5 14.4 6M12 20.5 9.6 18M12 20.5 14.4 18"/>
        <path d="M3.5 12 6 9.6M3.5 12 6 14.4M20.5 12 18 9.6M20.5 12 18 14.4"/>
      </svg>
    </button>
  </header>
  <div class="abody" id="wsBody"></div>
</div>

<!-- ★ 导航屏（2026-10-07 晚上）—— 创意工坊的门口 ✓。
     ＋ 进来先是这一屏 ✓：一个个图标 = 已经做过的组件（各自那条对话 ✓），
     外加一颗「新建组件」✓。点图标进**组件管理屏**（`#wsChat` ✓）。
     ⚠️ **这一屏不是对话本身** ✗ —— 对话在它上面那一屏 ✓（见 `#wsChat` ✓）。 -->
<div class="screen ascreen" id="wsNav">
  <header class="sub">
    <button class="icon-btn back" id="wsNavBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>创意工坊</h2>
    <!-- ★ 「diy 小助手」的入口 ✓ —— 用户定的：「agent 叫 diy 小助手，
         这个小助手的信息可以在导航界面右上角进入，右上角展示头像，
         点击进去后可以设置头像，昵称…」✓。
         ⚠️ 它**顶掉的是 `.spacer`** ✓（那个 40px 占位本来就为了标题居中 ✓）——
            头像做成 30px + 两侧留白，正好还是 40px 宽 ✓，居中不受影响 ✓。 -->
    <button class="icon-btn" id="wsDiy" aria-label="diy 小助手">
      <span class="diyav" id="wsDiyAv">助</span>
    </button>
  </header>
  <div class="abody" id="wsNavBody"></div>
</div>

<!-- ★ diy 小助手的设置 ✓（2026-10-07 深夜）—— 从导航屏右上角那个头像进来 ✓。
     用户定的：「可以设置头像，昵称和一些其他规则，**暂时只有头像和昵称**」✓。 -->
<div class="screen ascreen" id="diySet">
  <header class="sub">
    <button class="icon-btn back" id="diyBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>diy 小助手</h2>
    <div class="spacer"></div>
  </header>
  <div class="abody" id="diyBody"></div>
</div>

<!-- ★ 组件页（2026-10-07）—— **纯预览** ✓：只有组件本身 + 右上角一个图标。
     ★ 2026-10-07 晚上：底下那三条按钮（保留 / 继续改 / 删除）**全搬走了** ✓ ——
       用户定的：「不要有任何的提示和设置选项…这样界面就被压缩了」✓。
       那些事现在只在创意工坊的组件管理页里做 ✓（顶栏 ⋯ 里 ✓）。 -->
<div class="screen ascreen" id="compView">
  <header class="sub">
    <button class="icon-btn back" id="compBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2 id="compTitle">组件</h2>
    <!-- ★ 唯一的一个入口 ✓ —— 去它在工坊里那条对话 ✓（改它、删它、改名都在那儿 ✓）。
         ⚠️ 它**顶掉的是 `.spacer`** ✓ —— 那个占位本来就是为了让标题居中 ✓，
            现在这个图标正好占同样的 40px ✓，居中不受影响 ✓。 -->
    <button class="icon-btn" id="compChat" aria-label="和它对话">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12c0 4-3.8 7.2-8.5 7.2a10 10 0 0 1-2.6-.34L4.2 20.4l1.3-3.6A6.9 6.9 0 0 1 3.5 12c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2z"/>
      </svg>
    </button>
  </header>
  <div class="cpwrap" id="compWrap"></div>
</div>

<!-- ★ 对话屏（2026-10-07）—— 工坊里的那段对话，**从输入框的 ＋ 进** ✓。
     ⚠️ 它是**一条对话自己的页** ✓（不是"所有对话"✓）：
        ＋ 进来的默认是**上次那条** ✓，点顶栏中间那个名字可以换一条、或者开一条新的 ✓。
     ⚠️ 顶栏中间那块**是个按钮**（连着个小箭头 ✓），不是死标题 ✓。 -->
<div class="screen ascreen" id="wsChat">
  <header class="sub">
    <button class="icon-btn back" id="wsBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2><span class="nm" id="wsTitle">组件</span></h2>
    <button class="icon-btn" id="wsMore" aria-label="更多">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <circle cx="5.2" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/>
        <circle cx="18.8" cy="12" r="1.9"/>
      </svg>
    </button>
  </header>
  <div class="mkbody" id="wsMsgs"></div>
  <div class="mkst" id="wsStatus" hidden><i></i><span id="wsStatusText"></span></div>
  <!-- ★ 待发的图（2026-10-07 深夜 ✓）—— 和生活管家同一条规矩：
       选完**不立刻发** ✓，停在这儿等你把它要说的话打完 ✓，点发送才一起走 ✓。
       ⚠️ 放在输入框**上面** ✓：它和输入框是**一件事的两个部分** ✓
          （就像引用条那样 ✓），塞进输入框里会把输入框搅乱 ✗。 -->
  <div class="mkpend" id="wsPend" hidden></div>
  <!-- 引用条 —— 和群聊那条**同一个形状** ✓（见 CSS 那段 ✓）。
       ⚠️ 它是**输入状态**的一部分 ✓（微信也是），发完就没 ✓。 -->
  <div id="wsQbar" hidden>
    <div class="qbody">
      <div class="qwho" id="wsQwho"></div>
      <div class="qtext" id="wsQtext"></div>
    </div>
    <button class="qx" id="wsQclose" aria-label="取消引用">✕</button>
  </div>
  <div class="mkfoot">
    <textarea id="wsText" rows="1" placeholder="想做个什么？"></textarea>
    <!-- ★ 右边那个按钮**看图还是看发送**，由"输入框里有没有字"决定 ✓
         （用户定的：「添加后，输入字后，图片按钮替换为发送按钮」✓）——
         和生活管家那个 ＋ **一模一样** ✓（那边也是打字就把 ＋ 换成发送 ✓）。 -->
    <button class="mkpick" id="wsPick" aria-label="加一张图">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
        <circle cx="8.5" cy="9.5" r="1.4"/>
        <path d="M3.5 16.5l4.6-4.3a1.6 1.6 0 0 1 2.2 0l3.2 3 2-1.8a1.6 1.6 0 0 1 2.2 0l3.3 3.1"/>
      </svg>
    </button>
    <button class="mksend" id="wsSend" aria-label="发送">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.4 12 3.6 21 8.4 12 3.6 3z"/>
      </svg>
    </button>
  </div>
</div>
<input type="file" id="fileWs" accept="image/*" hidden>

<!-- 设置 -->
<div class="screen" id="settings">
  <header class="sub">
    <!-- 用 SVG 而不是文字字符 "<"：字体里的尖括号形状固定，模仿不出微信那种
         细笔画 + 圆角端点 + 偏窄角度的味道。stroke 用 currentColor，跟随主题。 -->
    <button class="icon-btn back" id="backChat" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 4.5 8.5 12 15 19.5" />
      </svg>
    </button>
    <h2>设置</h2>
    <!-- ★ 刷新按钮 —— 2026-10-06 从聊天页右上角**搬过来**的 ✓。
         它**顶掉了原来那个 `.spacer`** ✓ —— 那个占位本来就是
         "放一个和返回键等宽的东西、让标题真居中"用的 ✓，
         现在右边真有一个 40px 的按钮 ✓，占位就是多余的 ✗
         （留着标题会被挤偏左 ✓，正是它当初要解决的问题 ✓）。
         用 SVG 而不是 `↻` 字符 ✓ —— 和左边的返回箭头同一套画法 ✓，
         大小和颜色才对得上 ✓。
         （`#reloadBtn` 这个 id **没改** ✗ —— 下面那段绑定原样能用 ✓。） -->
    <button class="icon-btn plain" id="reloadBtn" aria-label="重新加载">
      <!-- 用的是 Feather 那个 rotate-cw ✓（`viewBox 0 0 24 24` ✓）。
           ⚠️ 别自己拼 ✗ —— 我上一版是算出来的弧 ✓，
             末端和箭头**差一点点接上** ✗ → 看着就像画歪了 ✓
             （用户原话："首尾几乎挨上了" ✓）。
             这个版本的弧线末端**正好落在**箭头那个拐角上 ✓，是接住的 ✓。
           `19` 而不是 22 ✓ —— 用户："刷新按钮稍微小一些" ✓
           （22 的描边箭头视觉上比 22 的返回箭头重一档 ✓）。 -->
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
    </button>
  </header>
  <div class="body">
    <!-- ★ **行序**（2026-10-06 用户定的）：
           我的 · 群名称 · 群昵称 · 管家 · 邀请码 · 检查更新 · 退出登录 ✓
         「组件」和「外观」**整个拿掉了** ✓ —— 用户说"后续我自有安排" ✓。
         （外观那几个按钮是 `$$('[data-theme-set]')` 遍历出来的 ✓，
           一个都没有就是什么都不做 ✓，不会报错 ✓。） -->

    <!-- ★ 「我的」排第一 ✓ —— 它去的是**整个账号**那一页（壳）✓。
         「群昵称」是**只在这个群里**生效的另一个东西 ✓ ——
         两行早先都叫「我的」✗，一页上看不出哪个是哪个 ✓。 -->
    <div class="item" data-act="shell"><span class="k">我的</span><span class="v" id="vMe"></span><span class="chev">›</span></div>
    <div class="item" data-act="gname"><span class="k">群名称</span><span class="v" id="vGname"></span><span class="chev">›</span></div>
    <div class="item" data-act="myprofile"><span class="k">群昵称</span><span class="v" id="vMy"></span><span class="chev">›</span></div>
    <div class="item" data-act="agentprofile"><span class="k">管家</span><span class="v" id="vAname"></span><span class="chev">›</span></div>

    <!-- ★ 「邀请码」右边直接写**码本身** ✓ —— 2026-10-06 用户定的。
         原来写的是"复制邀请码" ✗：那是个**动作说明** ✓，
         而人真正想看的、想抄给别人的，是**那串码** ✓。
         点这一行**依旧**是复制 ✓（提示语也还是"邀请码已复制" ✓）。 -->
    <div class="item" data-act="invite"><span class="k">邀请码</span><span class="v" id="vInvite"></span><span class="chev">›</span></div>

    <!-- 手动查更新。自动检查是"开 App 时问一次"，但那个时机不由你定——
         这一条让你随时能问，不用等。右边显示当前壳的版本号。 -->
    <div class="item" data-act="update"><span class="k">检查更新</span><span class="v" id="vAppVer"></span><span class="chev">›</span></div>

    <div class="item" data-act="logout"><span class="k danger">退出登录</span></div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>

<!-- ★ 确认框（2026-10-07 深夜）—— 用户定的：删东西不要"按钮上改字"那种提示，
     「只需要删除的时候弹出个框提示一下，二次确认就行」✓。 -->
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  // 壳的端口。**提到这儿是因为有两个用途** ✓（回壳 ✓、取壳那边的头像 ✓），
  // 原来它写在 `backToShell` 里面，别处够不着 ✗。
  const SHELL_PORT = 8730;
  const $$ = s => [...document.querySelectorAll(s)];

  // ── 给 agent 的扩展点 ──
  //
  // 这个 IIFE 把内部函数全关在里面了（`addMsg`、`show`、`enterApp` 外面都够不着）。
  // 那是**故意的**——但那样一来，agent 写的 `ui/app.js` 就什么也做不了，只能干瞪眼。
  //
  // 所以这里开一个**很小、很明确**的口子：几个钩子 + 几个工具函数，挂在
  // `window.LifeGuard` 上（见文件末尾）。不是通用插件系统，就是够它用。
  //
  // **钩子里的异常必须吞掉**：agent 写的代码报错，不能让整个界面跟着挂。
  const _hooks = { ready: [], message: [] };
  const _fire = (name, ...args) => {
    for (const fn of _hooks[name]) {
      try { fn(...args); }
      catch (e) { console.error('[LifeGuard hook ' + name + ']', e); }
    }
  };
  const _hook = name => fn => { if (typeof fn === 'function') _hooks[name].push(fn); };
  // ★ **这里原本是 `let token = localStorage.getItem('lg_token')`。已经删掉了。**
  //
  // 令牌现在住在 **httpOnly Cookie** 里：浏览器自动带上，而**这段 JS 读不到它**
  // ——这正是重点。页面上任何一段 JS 都摸不到凭证（包括 agent 写的
  // `ui/app.js`），所以"让它能写前端"才敢做。
  //
  // 所以：这里没有 token 变量，请求也不用再加 Authorization 头。
  // 判断"登录了没"不再是"本地有没有 token"，而是**打一次 /auth/me 看返不返 401**。
  let me = null, group = null, members = [], curStatus = 'idle';
  // ★ "刚才那一下是**长按**，不是点击" ✓ —— 2026-10-06 加。
  //
  // ⚠️ 为什么非要它 ✗：长按引用挂在 `touchstart` 上 ✓（`passive:true` ✓，
  //   没 preventDefault ✓），所以**手指抬起来之后浏览器照样会发一个 click** ✗。
  //   而头像上刚挂了"点一下进「我的」/进管家" ✓ →
  //   **长按引用会顺带把人带出聊天页** ✗，而且看起来完全莫名其妙 ✓。
  let pressFired = false;
  let ws = null, streamEl = null, streamBuf = '';

  // ── 系统留白 ──
  //
  // 原生壳只负责**上报数字**（状态栏多高、键盘多高），排版由这里决定。
  // 这样调布局改这个文件就行，不用让用户重装 App。
  // 浏览器里没有原生壳，CSS 的 env() 会兜住。
  const isNative = !!(window.LifeGuardNative && window.LifeGuardNative.isNative && window.LifeGuardNative.isNative());

  const applyInsets = (i) => {
    if (!i || typeof i !== 'object') return;
    // ★ 单位换算：原生报的是**物理像素**，CSS 用的是**逻辑像素**，
    //   必须除以设备像素比。不换算的话顶部会空出近三倍的距离——
    //   （同一个数字在原生 setPadding 里是对的，搬到 CSS 里就错了。）
    const dpr = window.devicePixelRatio || 1;
    const r = document.documentElement.style;
    r.setProperty('--inset-top', ((i.top || 0) / dpr) + 'px');
    // 原生报上来的 bottom 已经把键盘算进去了，所以 App 里不需要再额外加 --kb，
    // 否则键盘弹出时会留出双倍空白。
    r.setProperty('--inset-bottom', ((i.bottom || 0) / dpr) + 'px');
    r.setProperty('--kb', '0px');
    scrollDown();
  };
  window.__onInsets = applyInsets;

  if (isNative) {
    // 页面可能在原生首次派发之后才加载完，主动拉一次
    try { applyInsets(JSON.parse(window.LifeGuardNative.insets())); } catch {}
  } else if (window.visualViewport) {
    // 浏览器里的键盘兜底
    const onVV = () => {
      const vv = window.visualViewport;
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
      if (kb > 0) scrollDown();
    };
    window.visualViewport.addEventListener('resize', onVV);
    window.visualViewport.addEventListener('scroll', onVV);
  }

  // 底部面板：键盘弹起时自动滚到聚焦输入框
  const _panelEl = $('#sheetPanel');
  if (_panelEl) {
    new ResizeObserver(() => {
      const f = document.activeElement;
      if (f && _panelEl.contains(f) && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA')) {
        f.scrollIntoView({ block: 'center' });
      }
    }).observe(_panelEl);
    _panelEl.addEventListener('focusin', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        setTimeout(() => e.target.scrollIntoView({ block: 'center' }), 500);
      }
    });
  }

  // ── 主题 ──
  const applyTheme = (t) => {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('lg_theme', t);
    $$('[data-theme-set]').forEach(b => b.classList.toggle('on', b.dataset.themeSet === t));
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = t === 'light' ? '#f5f6fa' : '#0f1115';
    // 让原生同步状态栏图标的明暗，否则浅色主题下白图标会看不见
    try { window.LifeGuardNative?.setLightStatusBar?.(t === 'light'); } catch {}
  };
  applyTheme(localStorage.getItem('lg_theme') || 'dark');
  $$('[data-theme-set]').forEach(b => b.onclick = () => applyTheme(b.dataset.themeSet));

  const explain = (data, status) => {
    if (!data) return '请求失败 ' + status;
    if (typeof data === 'string') return data;
    const d = data.detail !== undefined ? data.detail : data;
    if (typeof d === 'string') return d;
    if (Array.isArray(d)) return d.map(i => {
      if (typeof i === 'string') return i;
      const f = (i.loc || []).filter(x => x !== 'body').join('.');
      const label = { username:'用户名', password:'密码', current_password:'当前密码',
                      new_password:'新密码', nickname:'昵称', name:'名称', content:'内容' }[f] || f;
      return (label ? label + '：' : '') + (i.msg || '');
    }).join('；');
    return JSON.stringify(d);
  };

  const api = async (path, opts = {}) => {
    const r = await fetch('/api' + path, {
      ...opts,
      credentials: 'same-origin',   // 带上 Cookie。同源本来就默认带，写明是为了别被将来改错
      headers: { 'Content-Type': 'application/json',
                 ...(opts.headers || {}) }
    });
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!r.ok) {
      const err = new Error(explain(data, r.status));
      err.status = r.status;   // 启动时要靠它分辨"没登录(401)"和"网络坏了"
      throw err;
    }
    return data;
  };

  // ★ 开机那圈转：**延迟 200ms 才亮** ✗→✓ —— 2026-10-06。
  //
  //   它原来是**写死在 HTML 里**的 ✓ → 第一帧就在屏幕上 ✓ →
  //   而这一趟加载往往一百多毫秒就完了 ✓ → 转圈**只闪了那么一下** ✓
  //   —— 用户说的"从我的进来会闪一下"，多半就是它 ✓
  //   （从「设置」回来不闪 ✓，因为那压根没换文档 ✓）。
  //
  //   现在：先藏着 ✓，200ms 还没好才亮 ✓ ——
  //   **快的时候它根本不出现** ✓，慢的时候它照常兜住"别让人对着空白等" ✓。
  let bootTimer = setTimeout(() => {
    const b = $('#boot');
    if (b) b.hidden = false;
  }, 200);

  const toast = (m) => {
    const t = $('#toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800);
  };
  const show = id => {
    // 第一屏出现的那一刻，才把开机占位收掉（否则会先闪一下空白/登录页）
    const boot = $('#boot');
    if (boot) boot.hidden = true;
    if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
    $$('.screen').forEach(s => {
      s.classList.remove('anim-in', 'anim-out');
      s.classList.toggle('on', s.id === id);
    });
  };

  // 告诉原生"我现在在哪个界面"，它据此决定返回键是"退回聊天"还是"退出应用"。
  // 网页里的界面切换不会进 WebView 历史，原生光靠 canGoBack 判断不出来。
  const tellNative = (name) => {
    try { window.LifeGuardNative?.setScreen?.(name); } catch {}
  };

  // 设置页单独处理：进出带动画，且打开时保留聊天页垫在底下
  const openSettings = () => {
    const c = $('#chat'), s = $('#settings');
    c.classList.add('on');
    s.classList.remove('anim-out');
    s.classList.add('on');
    s.classList.remove('anim-in');
    void s.offsetWidth;          // 强制重排，否则连续开关时动画不重放
    s.classList.add('anim-in');
    tellNative('settings');
  };

  const closeSettings = () => {
    const s = $('#settings');
    s.classList.remove('anim-in');
    s.classList.add('anim-out');
    const done = () => {
      s.removeEventListener('animationend', done);
      s.classList.remove('anim-out', 'on');
    };
    s.addEventListener('animationend', done);
    tellNative('chat');
    scrollDown();
  };

  // ══════════════════════════════════════════════════════════════════
  // 管家设置 —— 三屏：列表 / 改资料 / 编一档状态
  // ══════════════════════════════════════════════════════════════════
  //
  // ⚠️ **报给原生的屏名一律是 `'settings'`** ✗→✓ ——
  //   `MainActivity.kt:582` 只认这一个字符串 ✓，
  //   而且它**根本不看 `__goBack` 的返回值** ✗（我原来以为看 ✓）。
  //   报一个新名字的后果是：**界面开着，第一次返回什么都不发生 ✗，
  //   第二次直接退出 App** ✗ —— 而这三屏都是"没有返回箭头、全靠手势" ✗。

  const mkel = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  const KIND_LABEL = { idle: '待机显示', thinking: '思考中', silent: '保持沉默' };

  // 服务端那份配置（`group.agent_status` 是个 JSON **字符串** ✓）。
  const agentCfg = () => statusCfg || {
    idle: { on: true, lines: ['正在窥屏…'], every: 600 },
    thinking: { on: true, lines: ['正在思考…'] },
    silent: { on: true, lines: ['打算继续窥屏…'] },
  };

  /** 改配置**只有一个出口** ✓ —— 整份发上去（服务端是整份替换 ✓）。 */
  const commitCfg = (mutate) => {
    const cfg = JSON.parse(JSON.stringify(agentCfg()));
    mutate(cfg);
    return patchGroup({ agent_status: cfg }, true);
  };

  /** 改群设置。`quiet` = 不弹「已保存」✓ —— 打字时防抖存的那一次次弹会烦死人 ✗。 */
  const patchGroup = async (patch, quiet) => {
    try {
      const g = await api(`/groups/${group.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
      if (g) group = g;                       // 服务端回的就是那一行 ✓，直接用 ✓
      normalizeStatus();
      renderHeader(); renderSettings();
      if ($('#agent').classList.contains('on') && !promptEditing) renderAgent();
      if (!quiet) toast('已保存');
    } catch (e) { toast(e.message || '没存上'); }
  };

  // ── 三屏的进与出（一套写法 ✓）──────────────────────────────────
  const pushScreen = (id) => {
    const s = $('#' + id);
    s.classList.remove('anim-out');
    s.classList.add('on', 'anim-in');
    void s.offsetWidth;                 // 强制重排，否则连续开关时动画不重放 ✓
    tellNative('settings');             // ⚠️ 一律 'settings' ✓，见上面那段
  };
  const popScreen = (id) => {
    const s = $('#' + id);
    s.classList.remove('anim-in');
    s.classList.add('anim-out');
    const done = () => {
      s.removeEventListener('animationend', done);
      s.classList.remove('anim-out', 'on');
    };
    s.addEventListener('animationend', done);
    tellNative('settings');
  };

  // ── 屏①：列表 ─────────────────────────────────────────────────────
  const renderAgent = () => {
    const m = $('#agentBody');
    if (!m) return;
    m.textContent = '';

    // 资料块：**点它进"改管家资料"那一屏** ✓
    //   （用户 2026-10-06："不要下面的点一下换头像，而是点击进去后
    //     进入类似于我的进头像也一样" ✓）
    const prof = mkel('div', 'prof');
    const av = mkel('div', 'av', '管');
    applyAgentAvatar(av);
    prof.appendChild(av);
    const who = mkel('div', 'who');
    who.appendChild(mkel('div', 'n', agentName()));
    prof.appendChild(who);
    prof.appendChild(mkel('div', 'go', '›'));
    prof.onclick = openAgentEdit;
    m.appendChild(prof);

    m.appendChild(mkel('div', 'sec', '状态显示'));
    const g1 = mkel('div', 'grp');
    ['idle', 'thinking', 'silent'].forEach((k) => {
      const b = mkel('button', 'row');
      b.appendChild(mkel('span', 'rl', KIND_LABEL[k]));
      // 右边写的是**动作**「点击编辑」✓，不是那一档的当前值 ✗（用户定的 ✓）
      b.appendChild(mkel('span', 'act', '点击编辑'));
      b.onclick = () => openStateScreen(k);
      g1.appendChild(b);
    });
    m.appendChild(g1);

    m.appendChild(mkel('div', 'sec', '性格'));
    const g2 = mkel('div', 'grp');
    g2.appendChild(promptBlock());
    m.appendChild(g2);
  };

  // ── 性格：**直奔一个文本框** ✓（用户："不要给管家的话，直接一个文本框" ✓）──
  //
  // 平时只露**前两行** ✓（`-webkit-line-clamp:2` ✓），点开才展开编辑 ✓。
  let promptEditing = false;

  const promptBlock = () => {
    const wrap = mkel('div', 'pwrap');
    const draw = () => {
      wrap.textContent = '';
      const cur = (group && group.agent_user_prompt) || '';
      if (!promptEditing) {
        const box = mkel('div', 'pbox' + (cur ? '' : ' empty'),
                         cur || '描述一下管家的性格...');
        box.onclick = () => { promptEditing = true; draw(); };
        wrap.appendChild(box);
        return;
      }
      const ta = mkel('textarea', 'ptext');
      ta.value = cur;
      ta.maxLength = 2000;
      const foot = mkel('div', 'pfoot');
      const cnt = mkel('span', 'cnt', cur.length + ' / 2000');
      ta.oninput = () => { cnt.textContent = ta.value.length + ' / 2000'; };
      const cancel = mkel('button', null, '取消');
      cancel.style.color = 'var(--muted)';
      cancel.onclick = () => { promptEditing = false; draw(); };
      const save = mkel('button', null, '保存');
      save.onclick = () => {
        promptEditing = false;
        draw();                       // 先收起再存 ✓，这样失败时也不会卡在编辑态 ✓
        patchGroup({ agent_user_prompt: ta.value.trim() });
      };
      foot.appendChild(cnt);
      foot.appendChild(cancel);
      foot.appendChild(save);
      wrap.appendChild(ta);
      wrap.appendChild(foot);
      setTimeout(() => ta.focus(), 60);
    };
    draw();
    return wrap;
  };

  const openAgentSettings = () => {
    promptEditing = false;
    normalizeStatus();
    renderAgent();
    pushScreen('agent');
  };
  const closeAgentSettings = () => popScreen('agent');

  // ── 屏②：改管家资料（头像 + 昵称，**一起保存** ✓）────────────────
  //
  // 版式**照壳「我的」进头像那一页** ✓（`卡片(大头像+点击头像替换)` +
  // `卡片(昵称 + 保存)` + 卡片**外面**的「取消」✓）——
  // 用户 2026-10-06 明确要求"类似于我的进头像也一样"、
  // "在点击头像替换的下方、保存的上方再加一个昵称条" ✓、"底下还是取消" ✓。
  let editFile = null;

  const openAgentEdit = () => {
    editFile = null;
    renderAgentEdit();
    pushScreen('agentEdit');
  };
  const closeAgentEdit = () => popScreen('agentEdit');

  const renderAgentEdit = () => {
    const m = $('#agentEditBody');
    if (!m) return;
    m.textContent = '';

    // 卡片一：头像
    const card = mkel('div', 'card avcard');
    const f = mkel('input');
    f.type = 'file';
    f.accept = 'image/*';
    f.style.display = 'none';           // 原生文件框太丑，藏起来 ✓
    const big = mkel('div', 'bigav');
    const av = mkel('div', 'av', '管');
    applyAgentAvatar(av);
    av.onclick = () => f.click();       // **头像本身就是那个按钮** ✓，不多放按钮 ✓
    f.onchange = () => {
      const file = f.files && f.files[0];
      if (!file) return;
      // 选完**先在本地显示出来** ✓ —— 不然用户点完"看不到变化" ✓，
      // 会以为没选上、再点一次 ✓（压缩本来就要做 ✓，顺手画出来 ✓）。
      shrinkToJpeg(file, 320).then(blob => {
        editFile = new File([blob], 'a.jpg', { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        av.textContent = '';
        av.style.backgroundImage = "url('" + url + "')";
      }).catch(e => toast(e.message));
    };
    big.appendChild(av);
    card.appendChild(f);
    card.appendChild(big);
    card.appendChild(mkel('div', 'tip', '点击头像替换'));
    m.appendChild(card);

    // 卡片二：昵称 + 保存
    const card2 = mkel('div', 'card');
    card2.appendChild(mkel('label', null, '昵称'));
    const nm = mkel('input', 'field');
    nm.value = agentName();
    nm.maxLength = 32;
    card2.appendChild(nm);
    const err = mkel('div', 'err', '');
    card2.appendChild(err);
    const save = mkel('button', 'btn-save', '保存');
    card2.appendChild(save);
    m.appendChild(card2);

    // 卡片**外面**的取消 ✓ —— 夹在卡片里会跑到「保存」上面去 ✗（壳那边栽过 ✓）
    const back = mkel('div', 'swap');
    back.appendChild(mkel('b', null, '取消'));
    back.onclick = () => closeAgentEdit();
