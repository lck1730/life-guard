<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget：让键盘弹出时**收缩内容**而不是把页面顶上去。
     不写这个的话，安卓 WebView 会把输入框推到看不见的地方。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#171116">
<script>
  // ★ 2026-10-19：先把上次用的主题贴上 ✓ —— 奶霜/林深用户不必先闪一下深色底 ✓。
  //   登录后 `syncThemeForUser()` 会按账号换成这个人自己的那套 ✓。
  try {
    var _t = localStorage.getItem('lg_theme');
    if (_t === 'light') _t = 'cream';   // 旧版本存过的名字
    if (_t === 'cream' || _t === 'forest') document.documentElement.dataset.theme = _t;
  } catch (e) {}
</script>
<title>猪之家</title>
<link rel="icon" href="/static/app-icon.png">
<link rel="apple-touch-icon" href="/static/app-icon.png">
<link rel="stylesheet" href="/static/app.css">
<!-- ★ 2026-10-30：顶栏群名用的「站酷快乐体」（只给群名，正文不换字体 ✓）。
     字体拆成 unicode-range 子集，浏览器只下名字里用到的几个（每个 ~25KB ✓）。 -->
</head>
<body>

<!-- ★ 2026-10-20：**开局加载页** ✓ —— 从第一帧就盖住整屏 ✓，
     直到「消息画完 + 背景图解码完 + 至少 0.5 秒」才撤 ✓（见 01-core.js 的 `_bootReady` ✓）。
     ⚠️ **它不带 `hidden`** ✗ —— 以前那个转圈是藏着的、200ms 后才亮 ✓，
        所以慢的时候会先露一截空白 / 深色底 ✓；加载页反过来：**先亮着** ✓。
     ⚠️ 颜色全部走主题变量 ✓（`--bg` / `--text` / `--accent` / `--line` ✓）——
        夜阑 / 奶霜 / 林深三套自动跟着换 ✓，不用另写一份 ✓。 -->
<div id="boot" role="status" aria-label="正在加载猪之家">
  <div class="boot-aurora" aria-hidden="true"></div>
  <div class="boot-grid" aria-hidden="true"></div>
  <div class="boot-main">
    <div class="boot-mark" aria-hidden="true">
      <!-- 2026-11-22：换成「猪之家」的猪猪图标（与桌面图标同一张图）。 -->
      <img src="/static/app-icon.png" alt="">
    </div>
    <div class="boot-title">猪之家</div>
    <div class="boot-slogan">看看🐷和雅雅🐷的温馨小家~</div>
  </div>
  <div class="boot-foot">
    <div class="boot-bar" aria-hidden="true"><i></i></div>
    <div class="boot-tip">正在准备你的空间…</div>
  </div>
</div>

<!-- 登录 -->
<div class="screen" id="login">
  <!-- ★ 2026-10-09：**照壳原来那一版重做** ✗→✓（用户：「登录界面和注册界面
       之前保持一致，现在不对」✓）。版式全部照抄（`tools/lifeguard-shell.py`
       的 `renderLogin` ✓）：
         · hero 在**卡片外面**（大标题 + 一句广告词 ✓）
         · 每个输入框**上面有 label** ✓（不是光靠 placeholder ✓）
         · 注册时**内测码排第一** ✓（它是进门凭证 ✓）
         · 错误**在按钮下面** ✓，切换那行在最后 ✓
         · 文案也照抄：「还没有账号？创建一个」/「已有账号，去登录」✓ -->
  <div class="wrap">
    <div class="hero">
      <div class="t">猪之家</div>
      <div class="s">看看🐷和雅雅🐷的温馨小家~</div>
    </div>
    <div class="card">
      <label class="regonly" id="lBeta" hidden>内测码</label>
      <input class="field regonly" id="betaCode" placeholder="请填写内测码"
             autocapitalize="off" autocomplete="off" hidden>
      <label for="u">用户名</label>
      <input class="field" id="u" placeholder="用户名" autocapitalize="off" autocomplete="username">
      <label for="p">密码</label>
      <input class="field" id="p" type="password" placeholder="密码" autocomplete="current-password">
      <label class="regonly" id="lP2" hidden>重复密码</label>
      <input class="field regonly" id="p2" type="password" placeholder="再输一遍"
             autocomplete="new-password" hidden>
      <button class="btn-primary" id="doLogin">登录</button>
      <div class="err" id="loginErr"></div>
      <div class="swap"><b id="authSwap">还没有账号？创建一个</b></div>
    </div>
  </div>
</div>

<div class="screen" id="init">
  <!-- ★ 2026-10-09 用户定的两件事 ✗→✓：
       · 「第一次登录时的新建或加入生活空间也改名空间」✓
       · 「对空间的介绍去掉，界面简洁」✓ →
         原来那张"生活空间是什么"的浮卡**整个删了** ✓（点按钮直接进表单 ✓）。 -->
  <!-- ★ 2026-10-09 收拾过 ✗→✓（用户：「比较朴素…要那种简约大气又不会太简陋」✓）——
       做法不是"再糊一层装饰" ✗，而是**把它对齐到登录那一屏的版式** ✓：
       同一个 `.wrap` 卡片 ✓、同一套 `.hero .t/.s` 大小标题 ✓（他自己的规矩：
       同构界面必须长一样 ✓）。原来这里是三行裸文字 + 一颗按钮 ✓，
       什么都没有垫着 ✓ —— 那正是"简陋"的来源 ✓。 -->
  <div class="wrap">
    <div class="hero">
      <div class="t">欢迎使用猪之家</div>
      <div class="s">继续使用请先</div>
      <!-- ⚠️⚠️ **按钮必须在 `.hero` 里面** ✗→✓（2026-10-10 量出来的）——
           我这天早些时候把它挪到了 hero **外面** ✗：那样一来
           `align-items:center`（弹性盒子的居中 ✓）根本管不到它 ✓，
           而它是个 `inline-block` ✓ —— `margin:0 auto` 对**行内级**盒子无效 ✗✗
           → 它就**贴左**了 ✓（量出来的中点 196 ✓，卡片中点 250 ✓，差 54px ✓）。
           放回 hero 里面 = 它成了一个 flex item ✓ → 居中由 `align-items` 负责 ✓，
           和标题/副标题**同一个机制** ✓（以后不用再各管各的 ✓）。
         ⚠️ 原来的通栏按钮**看不出这个错** ✗（满宽一定是"居中"的 ✓）——
           这次改成"贴字的紧凑按钮" ✓ 才把它露出来 ✓。 -->
      <button class="btn-primary" id="initGo">＋&nbsp;&nbsp;新建或加入一个空间</button>
    </div>
    <!-- ⚠️ 这里有过一行「退出登录」（2026-10-09 加的 ✓，理由是"没有空间的人
         换不了号" ✓）—— 用户当天就让撤了 ✓（「得得，把退出登录去掉」✓）。
         ⚠️ **那个理由本身是真的** ✗（壳那版也防过这件事 ✓）：还没有空间的人
            确实进不到设置页 → 也就没有登出入口 ✓。撤了之后**这个缺口又回来了** ✓，
            先记在这儿 ✓，他哪天说"换不了号"就是这一条 ✓。 -->
  </div>
  <!-- ★ 2026-10-10 用户定的形状 ✓：**两个框 + 底部一颗按钮** ——
       每个框自己头上一行提示 ✓（「新建个空间？」/「加入已有空间？」✓），
       框里是占位提示 ✓（「为空间起个名字」/「输入邀请码」✓）；
       ⚠️ 两颗按钮并排那种**没有了** ✓（原来是一颗"新建"一颗"加入" ✓）——
         他说的是"底部一个按钮" ✓（名字「加入空间」✓，填哪个框就走哪条路 ✓）。 -->
  <div class="introcard" id="introCard" hidden>
    <label class="fld" for="spaceName">新建个空间？</label>
    <input class="field" id="spaceName" placeholder="为空间起个名字" maxlength="32" autocomplete="off">
    <label class="fld" for="joinCode">加入已有空间？</label>
    <input class="field" id="joinCode" placeholder="输入邀请码" maxlength="16"
           autocapitalize="characters" autocomplete="off">
    <!-- ⚠️ 一开始是**灰的** ✓（两个框都空 ✓），填了任意一个才亮 ✓ -->
    <button class="btn-primary" id="spaceGo" disabled>加入空间</button>
  </div>
</div>

<!-- 我的（数据由 JS 画 ✓ 和 `#agent` 一个做法 ✓） -->
<!-- ★ 2026-10-24：「我的」也**加了一条顶栏** ✓（和「聊天背景」「主题」同一套 `header.sub` ✓）——
     原来这一屏只有一张资料卡悬在状态栏下面 ✓，进来第一眼不知道自己在哪 ✓。
     ⚠️ **只有标题、没有返回箭头** ✓ —— 用户定的：「也是不要<，然后手势可返回」✓；
        两边各留一个 40px 占位 ✓ 让标题真居中 ✓（见 CSS `header.sub` 那几条 ✓）。
     ⚠️ 有顶栏之后 `.abody` 的顶距会自己变成 14px ✓（`.ascreen > header.sub ~ .abody` ✓）——
        **不用**另写 ✓。 -->
<div class="screen ascreen" id="me"><header class="sub"><h2>我的</h2><div class="spacer"></div></header><div class="abody" id="meBody"></div></div>
<!-- 改资料（头像 + 昵称 ✓）—— 和管家同一批 class ✓ -->
<div class="screen ascreen" id="meEdit"><div class="abody" id="meEditBody"></div></div>
<!-- 生活空间：改名 / 邀请码 / 退出该空间（用户 2026-10-08 定的三样 ✓） -->
<!-- 自我介绍（≤500 字 ✓，可空 ✓）—— 跟着每一轮进它脑子 ✓ -->
<!-- 别人的那一屏：头像+昵称（和我的、管家同构 ✓）+ 备注 ✓ -->
<div class="screen ascreen" id="peer"><div class="abody" id="peerBody"></div></div>

<!-- 聊天 -->
<div class="screen" id="chat">
  <!-- ★ 2026-10-29 暖光：三团很慢的呼吸光 + 几粒浮尘（纯装饰、不接事件） -->
  <div id="chatAmb" aria-hidden="true">
    <i class="a1"></i><i class="a2"></i><i class="a3"></i>
    <b class="m1"></b><b class="m2"></b><b class="m3"></b>
    <b class="m4"></b><b class="m5"></b><b class="m6"></b>
  </div>
  <header class="top">
    <div class="info"><div class="gname" id="gname">—</div></div>
  </header>
  <!-- 下拉刷新时从顶栏底下冒出来的小药丸 ✓ —— 平时 `opacity:0` 且不接事件 ✓，
       只在手指拽着的时候由 JS 摆位置 ✓。 -->
  <div id="pull" aria-hidden="true">
    <span class="pull-ico">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
    </span>
    <span class="pull-txt" id="pullTxt">下拉刷新</span>
  </div>
  <div id="msgs"></div>
  <div id="composer">
  <div id="petBar" aria-hidden="true">
<div id="catStage" aria-hidden="true" data-mood="sleep">
      <!-- 右边：猫窝 ✓（在猫后面 ✓ —— 猫趴进去就是躺在窝里 ✓）
           ★ 2026-10-31 第六版：不再是"一只椭圆垫子" ✗ ——
             编织篮身 + 后沿卷边（当靠背 ✓）+ 缝线垫子 + 小枕头 + 盖毯 +
             小鱼玩具 + 挂着的小星星 + 一团暖光 ✓。
             左右两边各露一截垫子 / 毯子 ✓（猫正好坐在中间那个洞里 ✓）。
           ⚠️ 篮子前圈本来就**比后圈低** ✓（透视 ✓）—— 猫的肚皮刚好落在前圈上沿 ✓，
             自己不画"围栏"也能看出是**陷在窝里**的 ✓。 -->
      <div class="cat-bed">
        <svg viewBox="0 0 56 28" focusable="false">
          <defs>
            <linearGradient id="lgBedRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f3d6b2"/>
              <stop offset="1" stop-color="#d9ac7e"/>
            </linearGradient>
            <radialGradient id="lgBedPad" cx="42%" cy="30%" r="80%">
              <stop offset="0" stop-color="#fffaf5"/>
              <stop offset=".6" stop-color="#fde9dc"/>
              <stop offset="1" stop-color="#f6d3bd"/>
            </radialGradient>
            <linearGradient id="lgBedBlanket" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fad2c0"/>
              <stop offset="1" stop-color="#eeae98"/>
            </linearGradient>
          </defs>
          <ellipse cx="28" cy="26.3" rx="23.4" ry="2.2" fill="#4a2a16" opacity=".15"/>
          <ellipse class="bed-glow" cx="28" cy="18.8" rx="23.6" ry="9"
                   fill="#ffd8a4" opacity=".2"/>
          <!-- 篮身 + 编织纹 ✓ -->
          <ellipse cx="28" cy="16" rx="25" ry="11" fill="url(#lgBedRim)"
                   stroke="#b98d5f" stroke-width="1.35"/>
          <g fill="none" stroke="#bf9060" stroke-linecap="round" opacity=".5">
            <ellipse cx="28" cy="16" rx="23.2" ry="9.6" stroke-width=".65"
                     stroke-dasharray="2.4 2.1"/>
            <path d="M7.4 19.8 C11 23.2 18 25.6 25 26.4" stroke-width=".8"/>
            <path d="M11.6 23.1 l2.3 1.5" stroke-width=".8"/>
            <path d="M16.4 25.2 l2.5 1" stroke-width=".8"/>
            <path d="M48.6 19.8 C45 23.2 38 25.6 31 26.4" stroke-width=".8"/>
            <path d="M44.4 23.1 l-2.3 1.5" stroke-width=".8"/>
            <path d="M39.6 25.2 l-2.5 1" stroke-width=".8"/>
          </g>
          <!-- 后沿卷边 ✓（比垫子高 → 像靠背 ✓；下半截被垫子压住 ✓） -->
          <path d="M5.2 14.6 C5.2 4.2 50.8 4.2 50.8 14.6" fill="none"
                stroke="#c39a6f" stroke-width="6.2" stroke-linecap="round"/>
          <path d="M5.2 14.6 C5.2 4.2 50.8 4.2 50.8 14.6" fill="none"
                stroke="#f6ddc1" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M9.2 10.8 C11.6 7.4 18 6.2 24 5.8" fill="none" stroke="#fff"
                stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
          <!-- 垫子 + 缝线 + 四颗小毛栗扣 ✓ -->
          <ellipse class="cat-bed-pad" cx="28" cy="16.4" rx="18.5" ry="7.6"
                   fill="url(#lgBedPad)" stroke="#d6ab7f" stroke-width=".9"/>
          <ellipse cx="28" cy="16.4" rx="16.2" ry="6.3" fill="none"
                   stroke="#e5b48e" stroke-width=".7" stroke-dasharray="1.5 2.1"/>
          <g fill="#f3c2b0" stroke="#d9a08c" stroke-width=".5">
            <circle cx="13.6" cy="14.9" r="1.05"/>
            <circle cx="42.4" cy="14.9" r="1.05"/>
            <circle cx="20.2" cy="21.8" r=".95"/>
            <circle cx="35.8" cy="21.8" r=".95"/>
          </g>
          <!-- 左前方盖毯 ✓（猫压住一角 → 像自己钻进去的 ✓） -->
          <g class="bed-blanket">
            <path d="M3.6 17.8 C7.6 15.9 14.6 16.3 18.8 18.6 C21 21.5 19.2 24.8 14.8 25.9 C9.6 26.9 4.6 25.1 3.2 22.3 C2.6 20.8 2.7 19 3.6 17.8 Z"
                  fill="url(#lgBedBlanket)" stroke="#d99f89" stroke-width=".9"/>
            <path d="M5 21.3 C8.6 22.7 13.8 22.9 18.2 21.6" fill="none"
                  stroke="#e3a38d" stroke-width="1" stroke-linecap="round"/>
            <path d="M4.4 23.2 C8.2 24.6 14 24.8 18.4 23.4" fill="none"
                  stroke="#fff2e8" stroke-width=".8" stroke-dasharray="1.5 1.9"
                  stroke-linecap="round" opacity=".9"/>
            <path d="M8.4 18.4 C8.9 20.2 8.6 22.2 7.6 23.8" fill="none"
                  stroke="#e3a38d" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
          </g>
          <!-- 左后方小枕头 ✓（猫挡住大半，只露一角 ✓） -->
          <g class="bed-pillow" transform="rotate(-8 11 10)">
            <rect x="6.2" y="6.6" width="10.4" height="7" rx="3.1" fill="#fff7ef"
                  stroke="#d6ab7f" stroke-width=".85"/>
            <path d="M8.2 11.2 h6.4" fill="none" stroke="#e8c9ad" stroke-width=".65"
                  stroke-dasharray="1.2 1.5"/>
            <path d="M11.4 8.6 c1.1 -1.3 3.2 -.3 2.6 1.2 c-.4 1 -1.8 1.8 -2.6 2.4 c-.8 -.6 -2.2 -1.4 -2.6 -2.4 c-.6 -1.5 1.5 -2.5 2.6 -1.2 z"
                  fill="#f3b3ab" opacity=".9"/>
          </g>
          <!-- 右前方小鱼玩具 ✓ -->
          <g class="bed-fish">
            <ellipse cx="48.2" cy="19.6" rx="3.4" ry="2.1" fill="#f8cfc4"
                     stroke="#d99f89" stroke-width=".75" transform="rotate(-12 48.2 19.6)"/>
            <path d="M45.2 20.6 l-2.6 -1.2 l.4 2.5 l-1.4 1.6 l2.6 .1 Z" fill="#f8cfc4"
                  stroke="#d99f89" stroke-width=".7" stroke-linejoin="round"/>
            <circle cx="50" cy="19" r=".42" fill="#a9735a"/>
            <path d="M47.4 21.2 q1.8 -.8 3.4 -.5" fill="none" stroke="#e8b3a4"
                  stroke-width=".6" stroke-linecap="round"/>
            <path d="M50.8 18.3 l.9 3.4" fill="none" stroke="#e8b3a4"
                  stroke-width=".55" stroke-linecap="round"/>
          </g>
          <!-- 右边挂一颗小星星 ✓（慢慢眨 ✓） -->
          <g class="bed-star">
            <path d="M51.6 12.4 C51.8 14.2 52.4 15 53.6 15.6" fill="none"
                  stroke="#bb8f63" stroke-width=".6" stroke-linecap="round"/>
            <path d="M53.6 14.6 l.7 1.6 1.7 .2 -1.3 1.2 .35 1.7 -1.5 -.8 -1.5 .8 .35 -1.7 -1.3 -1.2 1.7 -.2 Z"
                  fill="#ffd98e" stroke="#daa84f" stroke-width=".4" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
      <!-- 左边：猪猪 + 鸭鸭 ✓（2026-11-01 第十一版：重新建模 ✓）
           用户：「你不觉得猫猫建模很精致，猪猪鸭鸭很粗糙吗，而且个头还没有保持一致。
                   另外交互比较生硬」✓
           三件事一起改 ✓：
           ① **个头**：18px → **28px** ✓（猫 33px 宽 / 30px 高 ✓）——
              脑袋从 ~10px 长到 **18.5px** ✓，和猫那颗 ~20px 的脑袋终于一个量级 ✓；
              全身 ~26px 高 ✓（猫 ~30px ✓——小一圈，但不"迷你"✓）。
              两只各 28px ✓：鸭鸭 1–29、猪猪 30–58 ✓，还是原来那 58px 让位 ✓。
           ② **建模**：照猫"拆件"的路子重画 ✓（不是只换颜色 ✓）——
              鸭鸭：两片尾羽 / 蹼脚 + 三根趾线 / 翅膀三层羽毛 / 胸口软毛 /
                    上喙高光 + 鼻孔 + 下喙缝 / 眼睛两颗高光 / 星星 ✓；
              猪猪：双层耳（外耳 + 内耳 + 高光）/ 分趾蹄 / 两圈卷尾巴 /
                    肚皮软毛 / 鼻筒高光 + 鼻孔反光 / 腮红 ✓。
              脸**还是气泡贴纸那张** ✓ —— 坐标同一套、按 1.1 倍放大 ✓，长相没变 ✓。
              ⚠️ 线宽从 2.4 提到 **3** ✓（28px 下 ≈ 0.84px，和猫的 0.83px 对得上 ✓；
                 以前 18px + 2.4 → 0.43px，比猫细一半 → 看着"糊、糙"✓）。
           ③ **交互**：见 app.css / js/08-cat.js 的第十一版注释 ✓ ——
              蹦的时候头跟着一起蹦（`.fr-hop` ✓）、走动左右脚交替 ✓、
              趴下前先 `settle` ✓、醒来有时伸懒腰 ✓、猫走近时眼睛跟着看 ✓、
              两只碰面改成"靠过去 → 歪头 → 一起蹦 → 分开"✓。
           · 层序：它们 z1（在猫**后面** ✓）—— 猫走过去 / 挨着坐下时在前面 ✓。
