<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="280" height="320">
  <defs>
    <radialGradient id="bodyG" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffb46b"/>
      <stop offset="55%" stop-color="#f5a051"/>
      <stop offset="100%" stop-color="#e0823a"/>
    </radialGradient>
    <radialGradient id="headG" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ffbf72"/>
      <stop offset="60%" stop-color="#f5a051"/>
      <stop offset="100%" stop-color="#df7d33"/>
    </radialGradient>
    <radialGradient id="eyeG" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5ed0a0"/>
      <stop offset="100%" stop-color="#1f9e62"/>
    </radialGradient>
  </defs>

  <!-- 软影 -->
  <ellipse cx="70" cy="150" rx="42" ry="8" fill="#1a0f06" opacity="0.18"/>

  <!-- 尾巴：从身后绕到右前，卷个圈 -->
  <path d="M 96 96 C 122 92 128 64 112 58 C 104 55 100 62 104 68 C 108 74 100 78 95 74"
        fill="none" stroke="#e0823a" stroke-width="13" stroke-linecap="round"/>
  <path d="M 96 96 C 122 92 128 64 112 58" fill="none" stroke="#ffb46b" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- 身体 -->
  <path d="M 44 150 C 30 150 28 110 40 96 C 48 86 92 86 100 96 C 112 110 110 150 96 150 Z"
        fill="url(#bodyG)" stroke="#c4671f" stroke-width="2.5"/>
  <!-- 肚皮 -->
  <path d="M 56 148 C 50 128 52 104 70 100 C 88 104 90 128 84 148 Z"
        fill="#fbe7c6" opacity="0.95"/>
  <!-- 虎纹 -->
  <path d="M 44 110 q 8 -2 10 6" fill="none" stroke="#cf6f24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 96 108 q -8 0 -9 7" fill="none" stroke="#cf6f24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 前爪 -->
  <ellipse cx="58" cy="150" rx="11" ry="7" fill="#fbe7c6" stroke="#c4671f" stroke-width="2"/>
  <ellipse cx="82" cy="150" rx="11" ry="7" fill="#fbe7c6" stroke="#c4671f" stroke-width="2"/>

  <!-- 头 -->
  <circle cx="70" cy="62" r="34" fill="url(#headG)" stroke="#c4671f" stroke-width="2.5"/>
  <!-- 耳朵 -->
  <path d="M 40 46 L 36 18 L 58 36 Z" fill="#f0983e" stroke="#c4671f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 100 46 L 104 18 L 82 36 Z" fill="#f0983e" stroke="#c4671f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 43 40 L 41 26 L 53 35 Z" fill="#f7b8c0"/>
  <path d="M 97 40 L 99 26 L 87 35 Z" fill="#f7b8c0"/>
  <!-- 额纹 -->
  <path d="M 64 38 q 6 4 12 0" fill="none" stroke="#cf6f24" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 60 44 q 10 5 20 0" fill="none" stroke="#cf6f24" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- 脸颊腮红 -->
  <ellipse cx="50" cy="74" rx="7" ry="4.5" fill="#ff9aa8" opacity="0.55"/>
  <ellipse cx="90" cy="74" rx="7" ry="4.5" fill="#ff9aa8" opacity="0.55"/>

  <!-- 眼睛：大、亮、高光 ✓
       ★ 2026-10-28：加了 `class` ✓ —— 聊天里那只二狗要能**眨眼 / 打盹** ✓。
         它现在是被**内联**进页面的（`01-core.js` 里 fetch ✓），
         `<img>` 里的东西 CSS 够不着 ✗，内联之后 `opacity` 才切得动 ✓。
         ⚠️ 只切 `opacity` ✓：SVG 元素上的 CSS transform 在 WebView 里不稳 ✓
            （屋里那只猫全用 SMIL 也是这个原因 ✓）。 -->
  <ellipse class="eye-w" cx="56" cy="64" rx="7.5" ry="9.5" fill="white" stroke="#3a2a1c" stroke-width="1.6"/>
  <ellipse class="eye-w" cx="84" cy="64" rx="7.5" ry="9.5" fill="white" stroke="#3a2a1c" stroke-width="1.6"/>
  <ellipse class="eye-i" cx="56" cy="66" rx="4.6" ry="6.6" fill="url(#eyeG)"/>
  <ellipse class="eye-i" cx="84" cy="66" rx="4.6" ry="6.6" fill="url(#eyeG)"/>
  <ellipse class="eye-h" cx="57.5" cy="61" rx="2" ry="2.6" fill="white"/>
  <ellipse class="eye-h" cx="85.5" cy="61" rx="2" ry="2.6" fill="white"/>
  <ellipse class="eye-h" cx="54" cy="68" rx="1.1" ry="1.4" fill="white" opacity="0.8"/>
  <ellipse class="eye-h" cx="82" cy="68" rx="1.1" ry="1.4" fill="white" opacity="0.8"/>

  <!-- 闭着的眼 ✓（平时 `opacity:0` ✓，眨眼/打盹时露出来 ✓ —— 见 app.css） -->
  <g class="lid" fill="none" stroke="#7a4a2a" stroke-width="2.4" stroke-linecap="round">
    <path d="M 49 63 Q 56 69 63 63"/>
    <path d="M 77 63 Q 84 69 91 63"/>
  </g>

  <!-- 鼻子 -->
  <path d="M 67 76 l 6 0 l -3 4 Z" fill="#e07a8c" stroke="#b4526a" stroke-width="0.8"/>
  <!-- 嘴：笑脸 -->
  <path d="M 70 80 q -4 5 -8 2 M 70 80 q 4 5 8 2" fill="none" stroke="#7a4a2a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 胡须 -->
  <path d="M 44 78 q -8 -1 -12 -3 M 44 82 q -8 1 -12 4" fill="none" stroke="#9a6a3a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 96 78 q 8 -1 12 -3 M 96 82 q 8 1 12 4" fill="none" stroke="#9a6a3a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 铃铛项圈 ✓
       ★ 2026-10-28：加了 `class` ✓ —— 管家面板里能换配饰 ✓
         （蝴蝶结 / 围巾 / 花环 ✓，见 `01-core.js` 的 `applyWear()` ✓）。
         ⚠️ 换掉的那几样靠 CSS `display:none` 藏 ✓（`<img>` 里的够不着 ✗
            → 所以聊天里和面板里都是**内联**的 ✓）。 -->
  <g class="eg-bell">
    <path class="eg-collar" d="M 50 96 q 20 8 40 0" fill="none" stroke="#d83a3a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="100" r="6.5" fill="#ffd34d" stroke="#c9931f" stroke-width="1.6"/>
    <circle cx="70" cy="98.4" r="1.4" fill="#c9931f"/>
    <path d="M 70 101 l 0 3.5" stroke="#c9931f" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
